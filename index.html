// LAND/ISLAND POLYGONS - that water must avoid (from your screenshot: Long Island, Bear Island, Moultonborough Neck)
const ISLAND_POLYGONS=[
  // Long Island - large island bottom right in screenshot
  [[43.68,-71.36],[43.66,-71.32],[43.62,-71.33],[43.63,-71.37],[43.66,-71.39]],
  // Bear Island - small island near center bottom

  [[43.70,-71.42],[43.68,-71.40],[43.66,-71.41],[43.67,-71.44],[43.69,-71.44]],

function pointInPolygon(pt, poly){
  const x=pt.lng, y=pt.lat; let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][1], yi=poly[i][0], xj=poly[j][1], yj=poly[j][0];
    const intersect=((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}

function segmentsIntersect(a1,a2,b1,b2){
  function ccw(p1,p2,p3){return (p3.lat-p1.lat)*(p2.lng-p1.lng) > (p2.lat-p1.lat)*(p3.lng-p1.lng);}
  // Check if segments a1-a2 and b1-b2 intersect
  const denom=(a1.lng-a2.lng)*(b1.lat-b2.lat)-(a1.lat-a2.lat)*(b1.lng-b2.lng);
  if(Math.abs(denom)<1e-9) return false;
  const t=((a1.lng-b1.lng)*(b1.lat-b2.lat)-(a1.lat-b1.lat)*(b1.lng-b2.lng))/denom;
  const u=-((a1.lng-a2.lng)*(a1.lat-b1.lat)-(a1.lat-a2.lat)*(a1.lng-b1.lng))/denom;
  return t>=0&&t<=1&&u>=0&&u<=1;
}

function segmentIntersectsIsland(a,b){
  for(let poly of ISLAND_POLYGONS){
    // Check if segment crosses any edge of polygon
    for(let i=0;i<poly.length;i++){
      const p1={lat:poly[i][0],lng:poly[i][1]};
      const p2={lat:poly[(i+1)%poly.length][0],lng:poly[(i+1)%poly.length][1]};
      if(segmentsIntersect(a,b,p1,p2)) return true;
    }
    // Also check if midpoint is inside island
    const mid={lat:(a.lat+b.lat)/2,lng:(a.lng+b.lng)/2};
    if(pointInPolygon(mid,poly)) return true;
  }
  return false;
}

function isWaterSegmentValid(a,b){
  if(segmentIntersectsIsland(a,b)) return false;
  return true;
}

// Build water edges dynamically - only edges that don't cross islands
const WATER_EDGES=[];
for(let i=0;i<WATER_WAYPOINTS.length;i++){
  for(let j=i+1;j<WATER_WAYPOINTS.length;j++){
    const a=WATER_WAYPOINTS[i], b=WATER_WAYPOINTS[j];
    if(haversine(a,b) < 4.5 && isWaterSegmentValid(a,b)){ // only connect if <4.5mi and no island crossing
      WATER_EDGES.push([i,j]);
    }
  }
}

const REQ={car:{comfortable:0,marginal:0},pwc:{comfortable:6,marginal:4.5},smallboat:{comfortable:6,marginal:4},kayak:{comfortable:3,marginal:1.5},pedestrian:{comfortable:0,marginal:0},all:{comfortable:0,marginal:0}};
function adjClearance(base){return base + (FULL_LEVEL - lakeLevel);}
function statusFor(b){if(vessel==="all"||vessel==="car"||vessel==="pedestrian")return "pass";const adj=adjClearance(b.base);const req=REQ[vessel];if(adj>=req.comfortable)return "pass";if(adj>=req.marginal)return "marginal";return "fail";}
function haversine(a,b){const R=3958.8;const dLat=(b.lat-a.lat)*Math.PI/180;const dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function nearestWaterWaypoint(pt){let best=0,bestD=haversine(pt,WATER_WAYPOINTS[0]);for(let i=1;i<WATER_WAYPOINTS.length;i++){let d=haversine(pt,WATER_WAYPOINTS[i]);if(d<bestD){bestD=d;best=i;}}return best;}
function dijkstraWater(s,e){const n=WATER_WAYPOINTS.length;const dist=Array(n).fill(Infinity),prev=Array(n).fill(-1),vis=Array(n).fill(false);dist[s]=0;for(let iter=0;iter<n;iter++){let u=-1,minD=Infinity;for(let i=0;i<n;i++)if(!vis[i]&&dist[i]<minD){minD=dist[i];u=i;}if(u===-1)break;vis[u]=true;for(let [a,b] of WATER_EDGES){let v=-1;if(a===u)v=b;else if(b===u)v=a;else continue;const w=haversine(WATER_WAYPOINTS[u],WATER_WAYPOINTS[v]);if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}}}let path=[],cur=e;while(cur!==-1){path.unshift(cur);cur=prev[cur];}if(path[0]!==s)return [s,e];return path;}
function getWaterRoutePath(a,b){if(haversine(a,b)<1.2 && isWaterSegmentValid(a,b)) return [a,b];const s=nearestWaterWaypoint(a),e=nearestWaterWaypoint(b);const wpPath=dijkstraWater(s,e);let full=[a];for(let idx of wpPath)full.push(WATER_WAYPOINTS[idx]);full.push(b);return full;}
function getWaterDistance(a,b){const path=getWaterRoutePath(a,b);let d=0;for(let i=1;i<path.length;i++)d+=haversine(path[i-1],path[i]);return d;}
function totalDist(r,isCar){let d=0;for(let i=1;i<r.length;i++)d+= isCar?haversine(r[i-1],r[i]):getWaterDistance(r[i-1],r[i]);return d;}
function nearestNeighborOrder(points,fn){if(points.length<=1)return points.slice();let idx=points.findIndex(p=>p.id===1);if(idx===-1)idx=0;let u=points.slice();let s=u.splice(idx,1)[0];let o=[s];while(u.length>0){let last=o[o.length-1];let best=0,bestD=fn(last,u[0]);for(let i=1;i<u.length;i++){let d=fn(last,u[i]);if(d<bestD){bestD=d;best=i;}}o.push(u.splice(best,1)[0]);}return o;}
function twoOptSwap(arr,i,k){return arr.slice(0,i).concat(arr.slice(i,k+1).reverse()).concat(arr.slice(k+1));}
function twoOpt(route,fn){if(route.length<4)return route;let best=route.slice();let bestDist=0;for(let i=1;i<best.length;i++)bestDist+=fn(best[i-1],best[i]);let imp=true,iter=0;while(imp&&iter<50){imp=false;for(let i=1;i<best.length-2;i++){for(let k=i+1;k<best.length-1;k++){let nr=twoOptSwap(best,i,k);let nd=0;for(let j=1;j<nr.length;j++)nd+=fn(nr[j-1],nr[j]);if(nd<bestDist-0.001){best=nr;bestDist=nd;imp=true;}}}iter++;}return best;}
function shortestRoute(points,isCar){if(points.length<=2)return points;const fn=isCar?(a,b)=>haversine(a,b):getWaterDistance;return twoOpt(nearestNeighborOrder(points,fn),fn);}
function passes(b,v){if(v==='all')return true;return b.vessels[v]===true;}

async function getOsrmMatrix(points){try{const coords=points.map(p=>`${p.lng},${p.lat}`).join(';');const url=`https://router.project-osrm.org/table/v1/driving/${coords}?annotations=distance`;const resp=await fetch(url);const data=await resp.json();if(data.code!=='Ok')throw new Error('fail');return data.distances;}catch(e){let mat=[];for(let i=0;i<points.length;i++){mat[i]=[];for(let j=0;j<points.length;j++)mat[i][j]=i===j?0:haversine(points[i],points[j])*1609.34;}return mat;}}

async function getOsrmRoute(a,b){try{const url=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;const resp=await fetch(url);const data=await resp.json();if(data.code!=='Ok')throw new Error('fail');const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);const dist=data.routes[0].distance/1609.34;return{coords,dist};}catch(e){return{coords:[[a.lat,a.lng],[b.lat,b.lng]],dist:haversine(a,b)};}}

function filteredWater(){let f=BRIDGES.filter(b=>{const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);if(!ok)return false;if(!passes(b,vessel))return false;const s=statusFor(b);if(s==="pass")return true;if(s==="marginal"&&includeMarginal)return true;return vessel==="all";});return shortestRoute(f,false);}
function filteredCar(){return BRIDGES.filter(b=>{const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);if(!ok)return false;return passes(b,vessel);});}

async function render(){
const delta=FULL_LEVEL-lakeLevel;document.getElementById('lakeLevelLabel').textContent=lakeLevel.toFixed(2);document.getElementById('deltaLabel').textContent=(delta>=0?'+'+delta.toFixed(2):delta.toFixed(2))+'ft';
const isCar=vessel==='car';let route,roadDist=0;
if(isCar){let base=filteredCar();if(base.length>1){const matrix=await getOsrmMatrix(base);function roadFn(a,b){const i=base.indexOf(a),j=base.indexOf(b);if(i===-1||j===-1)return haversine(a,b);const d=matrix[i][j];return d?d/1609.34:haversine(a,b);}let ordered=nearestNeighborOrder(base,roadFn);ordered=twoOpt(ordered,roadFn);route=ordered;for(let i=1;i<route.length;i++){const ii=base.indexOf(route[i-1]),jj=base.indexOf(route[i]);roadDist+=ii!==-1&&jj!==-1&&matrix[ii][jj]?matrix[ii][jj]/1609.34:haversine(route[i-1],route[i]);}}else{route=base;}else{route=filteredWater();}

if(map){
markers.forEach(m=>{try{map.removeLayer(m)}catch(e){}});markers.clear();routeLines.forEach(l=>{try{map.removeLayer(l)}catch(e){}});routeLines=[];if(routeLine)try{map.removeLayer(routeLine)}catch(e){}
BRIDGES.forEach(b=>{const s=statusFor(b);const isIn=route.includes(b);const color=s==="pass"?"#16a34a":s==="marginal"?"#eab308":"#ef4444";const finalColor=vessel==="all"?(b.id===7?"#a855f7":"#16a34a"):color;const icon=L.divIcon({html:`<div style="background:${finalColor};width:30px;height:30px;border:3px solid white;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900;font-size:13px;opacity:${s==="fail"&&vessel!=="all"?0.3:isIn?1:0.5}">${isIn?route.indexOf(b)+1:b.id}</div>`,iconSize:[30,30],iconAnchor:[15,15]});const mk=L.marker([b.lat,b.lng],{icon}).addTo(map);mk.on('click',()=>openDetail(b.id));markers.set(b.id,mk);});
if(route.length>1){
if(isCar){for(let i=1;i<route.length;i++){const leg=await getOsrmRoute(route[i-1],route[i]);const line=L.polyline(leg.coords,{color:'#ea580c',weight:5,opacity:0.9}).addTo(map);routeLines.push(line);}}else{
// Water: draw via waypoint graph, avoids islands
let fullPath=[];
for(let i=0;i<route.length;i++){
if(i>0){
const segPath=getWaterRoutePath(route[i-1],route[i]);
for(let j=1;j<segPath.length-1;j++) fullPath.push([segPath[j].lat,segPath[j].lng]);
}
fullPath.push([route[i].lat,route[i].lng]);
}
routeLine=L.polyline(fullPath,{color:'#2563eb',weight:5,opacity:0.85}).addTo(map);
}
}
}
let dist=isCar?roadDist:totalDist(route,false);
document.getElementById('routeInfo').textContent=`${route.length} stops • ${dist.toFixed(1)} mi ${isCar?'road':'water avoids land'} • ${vessel.toUpperCase()}`;
document.getElementById('countBadge').textContent=`${route.length} / 20 • ${dist.toFixed(1)} mi`;
document.getElementById('list').innerHTML=route.map((b,idx)=>{const s=statusFor(b);const adj=adjClearance(b.base);return `<div class="bg-white rounded-[14px] border overflow-hidden shadow-sm cursor-pointer" onclick="openDetail(${b.id})"><div class="flex gap-0"><img src="${b.photo}" loading="lazy" decoding="async" class="w-[64px] h-[64px] object-cover shrink-0 m-2 rounded-lg" onerror="this.src='images/bridge-1.webp'"><div class="p-2 flex-1 min-w-0"><div class="font-black text-[12px]">#${idx+1} ${b.name}</div><div class="text-[10px] text-zinc-600">${b.zone} • Adj ${adj.toFixed(1)}ft • ${s.toUpperCase()} ${isCar?'ROAD':'WATER no land'}</div><div class="text-[10px] mt-1"><span class="bg-zinc-900 text-white px-2 py-0.5 rounded-full text-[9px] font-bold">${idx < route.length-1 ? getWaterDistance(b,route[idx+1]).toFixed(2)+' mi → next' : 'END'}</span></div></div></div></div>`;}).join('');
}

function openDetail(id){const b=BRIDGES.find(x=>x.id===id);if(!b)return;const f=vessel==='car'?filteredCar():filteredWater();const idx=f.findIndex(x=>x.id===id);if(map)map.flyTo([b.lat,b.lng],14);const adj=adjClearance(b.base);const s=statusFor(b);document.getElementById('detailInner').innerHTML=`<div class="p-3"><div class="flex justify-between"><div><div class="font-black text-[13px]">#${idx+1} ${b.name}</div><div class="text-[10px] bg-zinc-100 px-2 py-1 rounded-full mt-1">${b.zone} • Adj ${adj.toFixed(1)}ft • ${s}</div></div><button onclick="closeDetail()" class="h-8 w-8 rounded-full bg-zinc-100 grid place-items-center">✕</button></div><img src="${b.photo}" class="w-full h-[200px] object-cover rounded-xl mt-2" loading="lazy"><div class="mt-2 text-[11px]">Water route avoids Long Island, Bear Island, Moultonborough Neck via water waypoints. Photos: /images/ 30KB WebP lazy.</div></div>`;document.getElementById('detail').classList.remove('hidden');}
function closeDetail(){document.getElementById('detail').classList.add('hidden');}
window.openDetail=openDetail;window.closeDetail=closeDetail;
document.querySelectorAll('.vBtn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.vBtn').forEach(b=>b.className='vBtn px-2 h-7 rounded-full bg-zinc-100 font-bold text-[10px]');btn.className='vBtn px-2 h-7 rounded-full bg-black text-white font-bold text-[10px]';vessel=btn.dataset.v;render();});});
document.getElementById('lakeSlider').addEventListener('input',e=>{lakeLevel=parseFloat(e.target.value);render();});
document.getElementById('resetBtn').addEventListener('click',()=>{lakeLevel=FULL_LEVEL;document.getElementById('lakeSlider').value=FULL_LEVEL;render();});
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
document.getElementById('search').addEventListener('input',e=>{term=e.target.value.toLowerCase();render();});
function initMap(){map=L.map('map',{center:[43.60,-71.38],zoom:11});L.control.zoom({position:'bottomright'}).addTo(map);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});L.control.layers({"Streets":osm,"Satellite":sat}).addTo(map);setTimeout(()=>map.invalidateSize(),400);}
initMap();render();
</script>
</body>
