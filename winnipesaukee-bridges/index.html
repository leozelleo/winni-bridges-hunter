<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winnipesaukee 20 Bridges — All Routes</title>
<meta name="description" content="All 20 low bridges on Lake Winnipesaukee, filterable by vessel, with the shortest route between them.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{ --ink:#0f2438; --lake:#1c7293; --paper:#f6f4ef; }
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif}
  #map{height:100%;width:100%}
  .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}
  .safe-b{padding-bottom:env(safe-area-inset-bottom)}
  .safe-t{padding-top:env(safe-area-inset-top)}
  .navlink{color:rgba(255,255,255,.55)}
  .navlink.active{color:#fff}
  ::-webkit-scrollbar{height:6px;width:6px}
  ::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:99px}
  #detail{transition:opacity .18s ease}
  #detailInner{transition:transform .22s cubic-bezier(.32,.72,0,1)}
</style>
</head>
<body class="flex flex-col h-screen bg-[color:var(--paper)]">

<header class="safe-t shrink-0" style="background:var(--ink)">
  <div class="px-4 pt-3 flex justify-between items-start gap-3">
    <div class="min-w-0">
      <div class="text-white font-black text-[15px] tracking-tight">Winnipesaukee Bridges</div>
      <div class="text-white/50 text-[10.5px] mt-0.5">All 20 low bridges &middot; shortest route by vessel</div>
    </div>
    <button id="gpxBtn" class="shrink-0 bg-white text-[color:var(--ink)] text-[11px] font-bold px-3 py-2 rounded-full active:scale-95 transition">Export GPX</button>
  </div>
  <nav class="px-4 mt-3 flex gap-4 text-[12px] font-bold border-b border-white/10">
    <a class="navlink active pb-2 border-b-2 border-white" href="index.html">All 20</a>
    <a class="navlink pb-2 border-b-2 border-transparent" href="route.html">Route Planner</a>
    <a class="navlink pb-2 border-b-2 border-transparent" href="live.html">Live Lake Level</a>
  </nav>
</header>

<div class="bg-white border-b p-2 flex gap-2 overflow-x-auto shrink-0">
  <button data-v="all" class="vBtn px-3 h-9 rounded-full font-bold text-[12px] whitespace-nowrap">All 20</button>
  <button data-v="car" class="vBtn px-3 h-9 rounded-full font-bold text-[12px] whitespace-nowrap">🚗 Car (6)</button>
  <button data-v="pwc" class="vBtn px-3 h-9 rounded-full font-bold text-[12px] whitespace-nowrap">🛥️ PWC</button>
  <button data-v="smallboat" class="vBtn px-3 h-9 rounded-full font-bold text-[12px] whitespace-nowrap">⛵ Small Boat</button>
  <button data-v="kayak" class="vBtn px-3 h-9 rounded-full font-bold text-[12px] whitespace-nowrap">🛶 Kayak</button>
  <button data-v="pedestrian" class="vBtn px-3 h-9 rounded-full font-bold text-[12px] whitespace-nowrap">🚶 Walk</button>
</div>

<div class="flex flex-1 min-h-0 flex-col lg:flex-row">
  <div class="flex-1 relative bg-[#aad3df] min-h-[38vh]">
    <div id="map"></div>
    <div id="routeInfo" class="mono absolute bottom-3 left-3 z-[400] bg-black/80 text-white text-[11px] px-3 py-1.5 rounded-full"></div>
  </div>
  <div class="lg:w-[420px] bg-[color:var(--paper)] flex flex-col min-h-0 max-h-[62vh] lg:max-h-none border-t lg:border-t-0 lg:border-l">
    <div class="p-2 bg-white border-b sticky top-0 z-10">
      <input id="search" placeholder="Search bridges, zones..." class="w-full h-10 px-3 rounded-lg bg-zinc-100 border text-[13px] outline-none focus:ring-2 focus:ring-[color:var(--lake)]">
    </div>
    <div id="list" class="flex-1 overflow-y-auto p-2 grid grid-cols-1 gap-2"></div>
  </div>
</div>

<div id="detail" class="hidden fixed inset-0 z-[1000] bg-black/50 flex items-end lg:items-center justify-center">
  <div class="w-full lg:max-w-[480px] bg-white rounded-t-[20px] lg:rounded-[20px] overflow-hidden safe-b translate-y-full lg:translate-y-0" id="detailInner"></div>
</div>

<script src="shared/data.js"></script>
<script src="shared/routing.js"></script>
<script src="shared/photo.js"></script>
<script>
let vessel = "all", term = "", map, markers = new Map(), routeLine = null;

const VBTN_BASE = 'vBtn px-3 h-9 rounded-full font-bold text-[12px] whitespace-nowrap';
function paintVesselButtons(){
  document.querySelectorAll('.vBtn').forEach(b=>{
    b.className = VBTN_BASE + (b.dataset.v === vessel
      ? ' text-white' : ' bg-zinc-100 text-zinc-700');
    if(b.dataset.v === vessel) b.style.background = 'var(--ink)'; else b.style.background = '';
  });
}

function initMap(){
  map = L.map('map', { center: [43.60, -71.38], zoom: 11, zoomControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
  L.control.layers({ "Streets": osm, "Satellite": sat }).addTo(map);
  setTimeout(() => map.invalidateSize(), 300);
}

function passes(b, v){ if (v === 'all') return true; return b.vessels[v] === true; }
function dotColor(b, v){
  if (v === 'all') return '#0f2438';
  return b.vessels[v] ? (b.clearanceFt < 4 && (v === 'pwc' || v === 'smallboat') ? '#d97706' : '#16a34a') : '#dc2626';
}
function label(v, b){
  if (!b.vessels[v]) return '✕ No';
  if (v === 'pwc' && b.clearanceFt < 5) return '⚠ Duck under';
  if (v === 'smallboat' && b.clearanceFt < 6) return '⚠ Bimini down';
  if (v === 'kayak' && b.clearanceFt < 3) return '⚠ Portage';
  return '✓ Yes';
}

function filteredBridges(){
  const f = BRIDGES.filter(b => {
    const s = (b.name + ' ' + b.zone + ' ' + b.type).toLowerCase();
    return (!term || s.includes(term)) && passes(b, vessel);
  });
  return shortestRoute(f);
}

function render(){
  const f = filteredBridges();
  if (map){
    markers.forEach(m => { try{ map.removeLayer(m); }catch(e){} }); markers.clear();
    if (routeLine) try{ map.removeLayer(routeLine); }catch(e){}
    if (f.length > 1){
      const latlngs = f.map(b => [b.lat, b.lng]);
      routeLine = L.polyline(latlngs, { color: '#1c7293', weight: 4, opacity: 0.85 }).addTo(map);
      try{ map.fitBounds(L.latLngBounds(latlngs).pad(0.15)); }catch(e){}
    }
    f.forEach((b, idx) => {
      const icon = L.divIcon({
        html: `<div style="background:${dotColor(b, vessel)};width:28px;height:28px;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.45);display:grid;place-items:center;font-size:11px;font-weight:900;color:white">${idx + 1}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14], className: ''
      });
      const mk = L.marker([b.lat, b.lng], { icon }).addTo(map);
      mk.on('click', () => openDetail(b.id));
      markers.set(b.id, mk);
    });
  }
  const dist = totalRouteDist(f);
  document.getElementById('routeInfo').textContent = `${f.length} stops · ${dist.toFixed(1)} mi · ${vessel.toUpperCase()} shortest route`;
  document.getElementById('list').innerHTML = f.map((b, idx) => `
    <div class="bg-white rounded-[14px] border overflow-hidden shadow-sm cursor-pointer active:scale-[.99] transition" onclick="openDetail(${b.id})">
      <div class="flex gap-2">
        ${photoImgTag(b, 'w-[92px] h-[92px] object-cover shrink-0 bg-zinc-100')}
        <div class="p-2 flex-1 min-w-0">
          <div class="font-bold text-[12.5px] leading-tight">#${idx + 1} — ${b.name}</div>
          <div class="mono text-[10px] text-zinc-500 mt-0.5">${b.zone} · ${b.clearance} · ${b.lat.toFixed(4)}, ${b.lng.toFixed(4)}</div>
          <div class="text-[11px] mt-1 font-bold" style="color:${dotColor(b, vessel)}">${vessel.toUpperCase()}: ${label(vessel, b)} ${idx < f.length - 1 ? '· ' + haversineMiles(b, f[idx + 1]).toFixed(2) + ' mi to next' : '· END'}</div>
        </div>
        <div class="w-2 self-stretch" style="background:${dotColor(b, vessel)}"></div>
      </div>
    </div>
  `).join('') || `<div class="p-10 text-center text-zinc-500 text-[13px]">No bridges match that search.</div>`;
}

function openDetail(id){
  const b = BRIDGES.find(x => x.id === id); if (!b) return;
  if (map) map.flyTo([b.lat, b.lng], 15);
  const rows = ['car','pwc','smallboat','kayak','pedestrian'].map(v => {
    const ok = b.vessels[v];
    const c = ok ? (b.clearanceFt < 4 && v !== 'pedestrian' && v !== 'kayak' ? '#d97706' : '#16a34a') : '#dc2626';
    return `<div class="flex justify-between py-2 border-b text-[12px]"><span class="font-bold">${v.toUpperCase()}</span><span style="color:${c};font-weight:800">${ok ? label(v, b) : '✕ No'}</span></div>`;
  }).join('');
  document.getElementById('detailInner').innerHTML = `
    <div class="p-4">
      <div class="mx-auto lg:hidden w-10 h-1.5 rounded-full bg-zinc-200 -mt-1 mb-3"></div>
      <div class="flex justify-between gap-3">
        <div class="min-w-0">
          <div class="font-black text-[16px] leading-tight">${b.name}</div>
          <div class="text-[10px] bg-zinc-100 inline-block px-2 py-1 rounded-full mt-1.5">${b.zone} · ${b.clearance}</div>
          <div class="mono text-[11px] font-bold text-green-700 mt-1.5">${b.lat.toFixed(6)}, ${b.lng.toFixed(6)}</div>
        </div>
        <button onclick="closeDetail()" class="shrink-0 h-9 w-9 rounded-full bg-zinc-100 grid place-items-center text-lg leading-none">&times;</button>
      </div>
      <div class="mt-3 border rounded-xl p-3">${rows}</div>
      <div class="mt-3 bg-zinc-50 border rounded-xl p-3 text-[11px] text-zinc-600">${b.type}</div>
      <div class="mt-3"><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" rel="noopener" class="h-11 w-full grid place-items-center rounded-full text-white font-bold text-[13px]" style="background:var(--ink)">Open in Google Maps</a></div>
    </div>`;
  const wrap = document.getElementById('detail');
  wrap.classList.remove('hidden');
  requestAnimationFrame(() => document.getElementById('detailInner').classList.remove('translate-y-full'));
}
function closeDetail(){
  document.getElementById('detailInner').classList.add('translate-y-full');
  setTimeout(() => document.getElementById('detail').classList.add('hidden'), 180);
}
window.openDetail = openDetail; window.closeDetail = closeDetail;

document.getElementById('search').addEventListener('input', e => { term = e.target.value.toLowerCase(); render(); });
document.querySelectorAll('.vBtn').forEach(btn => {
  btn.addEventListener('click', () => { vessel = btn.dataset.v; paintVesselButtons(); render(); });
});
document.getElementById('gpxBtn').addEventListener('click', () => {
  const f = filteredBridges();
  let gpx = `<?xml version="1.0"?><gpx><name>Winni 20 ${vessel} shortest</name><desc>Shortest route ${vessel} — ${f.length} stops — ${totalRouteDist(f).toFixed(1)} mi</desc>`;
  f.forEach(b => { gpx += `<wpt lat="${b.lat}" lon="${b.lng}"><name>${b.id}. ${b.name}</name><desc>${b.clearance}</desc></wpt>`; });
  gpx += `</gpx>`;
  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `winnipesaukee_20_shortest_${vessel}.gpx`; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('detail').addEventListener('click', e => { if (e.target.id === 'detail') closeDetail(); });

paintVesselButtons();
initMap(); render();
</script>
</body>
</html>
