<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Winni Real Photos Only</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><style>body{margin:0;font-family:system-ui}#header{padding:10px;background:#0f172a;color:white}#map{height:55vh}#panel{display:grid;grid-template-columns:1.4fr .6fr;gap:12px;padding:12px}.card{border:1px solid #ddd;padding:12px;border-radius:8px}.bridge{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.badge{padding:2px 6px;border-radius:8px;font-size:11px}.ok{background:#dcfce7}.danger{background:#fee2e2}.no-photo{width:80px;height:60px;background:#f1f5f9;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:10px}</style></head><body><div id='header'><h1>Winni-Bridges-Hunter REAL PHOTOS ONLY - 21 bridges</h1><div id='lakeStatus'>Loading</div></div><div id='map'></div><div id='panel'><div class='card'><div id='list'></div></div><div class='card'><div id='route'></div></div></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>let cur=504.1,bridges=[];async function load(){bridges=await (await fetch('./data/bridges.json')).json();const d=await (await fetch('/api/lakelevel')).json();cur=d.level;document.getElementById('lakeStatus').textContent=`Level ${d.level} ft LIVE`;render();init();}function clr(b){return b.baseClearanceFt-(cur-504.32);}function render(){const l=document.getElementById('list');l.innerHTML='';bridges.forEach(b=>{const c=clr(b);let ph=b.photoUrl?`<img src='${b.photoUrl}' style='width:80px;height:60px;object-fit:cover'>`:`<div class='no-photo'>No real<br>photo</div>`;l.innerHTML+=`<div class='bridge'>${ph}<div><b>${b.name}</b><br>${c.toFixed(1)}ft current</div></div>`;});}function init(){const m=L.map('map').setView([43.61,-71.42],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);bridges.forEach(b=>{L.marker([b.lat,b.lng]).addTo(m).bindPopup(b.name);});}load();</script></body></html>
