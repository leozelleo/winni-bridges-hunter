<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Winni 21 Photos</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><style>body{margin:0;font-family:system-ui}#header{padding:10px;background:#0f172a;color:white}#map{height:50vh}#panel{display:grid;grid-template-columns:1.4fr.6fr;gap:12px;padding:12px}.card{border:1px solid #ddd;padding:12px;border-radius:8px}.bridge{display:grid;grid-template-columns:90px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.bridge img{width:90px;height:68px;object-fit:cover;border-radius:6px}</style></head><body><div id='header'><h1>Winni 21 Bridges - 21 REAL PHOTOS</h1><div id='lakeStatus'>LIVE</div></div><div id='map'></div><div id='panel'><div class='card'><h3>21 Bridges</h3><div id='list'></div></div><div class='card'><div id='preview'></div></div></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>let cur=504.1,bridges=[];async function load(){bridges=await (await fetch('./data/bridges.json')).json();const d=await (await fetch('/api/lakelevel')).json();cur=d.level;document.getElementById('lakeStatus').textContent='Level '+d.level+' ft LIVE';render();initMap();}function clr(b){return b.baseClearanceFt-(cur-504.32);}function render(){const l=document.getElementById('list');l.innerHTML='';bridges.forEach(br=>{const c=clr(br);const div=document.createElement('div');div.className='bridge';div.innerHTML=`<img src='./images/${br.photo}'><div><b>${br.name}</b><br>${c.toFixed(1)}ft</div><div>${c.toFixed(1)}ft</div>`;div.onclick=()=>{document.getElementById('preview').innerHTML=`<img src='./images/${br.photo}' style='width:100%'><br><b>${br.name}</b>`;};l.appendChild(div);});}function initMap(){const m=L.map('map').setView([43.61,-71.42],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);bridges.forEach(br=>{L.marker([br.lat,br.lng]).addTo(m).bindPopup(br.name);});}load();</script></body></html>
