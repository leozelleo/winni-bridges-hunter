function pointInPoly(pt, poly){
  const x=pt.lng, y=pt.lat; let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][1], yi=poly[i][0], xj=poly[j][1], yj=poly[j][0];
    const intersect=((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function segIntersect(a1,a2,b1,b2){
  const denom=(a1.lng-a2.lng)*(b1.lat-b2.lat)-(a1.lat-a2.lat)*(b1.lng-b2.lng);
  if(Math.abs(denom)<1e-9) return false;
  const t=((a1.lng-b1.lng)*(b1.lat-b2.lat)-(a1.lat-b1.lat)*(b1.lng-b2.lng))/denom;
  const u=-((a1.lng-a2.lng)*(a1.lat-b1.lat)-(a1.lat-a2.lat)*(a1.lng-b1.lng))/denom;
  return t>=0&&t<=1&&u>=0&&u<=1;
}
function crossesIsland(a,b){
  for(let poly of ISLAND_POLYS){
    for(let i=0;i<poly.length;i++){
      const p1={lat:poly[i][0],lng:poly[i][1]}, p2={lat:poly[(i+1)%poly.length][0],lng:poly[(i+1)%poly.length][1]};
      if(segIntersect(a,b,p1,p2)) return true;
    }
    const mid={lat:(a.lat+b.lat)/2,lng:(a.lng+b.lng)/2};
    if(pointInPoly(mid,poly)) return true;
  }
  return false;
}
function isDirectWaterValid(a,b){
  // Must be inside lake outer polygon and not cross islands
  const mid={lat:(a.lat+b.lat)/2,lng:(a.lng+b.lng)/2};
  if(!pointInPoly(mid, LAKE_POLY)) return false; // outside lake = over land
  if(crossesIsland(a,b)) return false;
  return true;
}

function haversine(a,b){const R=3958.8;const dLat=(b.lat-a.lat)*Math.PI/180;const dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function nearestWP(pt){let best=0,bestD=haversine(pt,WATER_WAYPOINTS[0]);for(let i=1;i<WATER_WAYPOINTS.length;i++){let d=haversine(pt,WATER_WAYPOINTS[i]);if(d<bestD){bestD=d;best=i;}}return best;}
function dijkstra(s,e){const n=WATER_WAYPOINTS.length;const dist=Array(n).fill(Infinity),prev=Array(n).fill(-1),vis=Array(n).fill(false);dist[s]=0;for(let iter=0;iter<n;iter++){let u=-1,minD=Infinity;for(let i=0;i<n;i++)if(!vis[i]&&dist[i]<minD){minD=dist[i];u=i;}if(u===-1)break;vis[u]=true;for(let [a,b] of WATER_EDGES){let v=-1;if(a===u)v=b;else if(b===u)v=a;else continue;const w=haversine(WATER_WAYPOINTS[u],WATER_WAYPOINTS[v]);if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}}}let path=[],cur=e;while(cur!==-1){path.unshift(cur);cur=prev[cur];}if(path[0]!==s)return [s,e];return path;}
function getWaterPath(a,b){
  try{
    if(isDirectWaterValid(a,b)) return [a,b]; // Bizer: direct when no island/land crossing
    const s=nearestWP(a),e=nearestWP(b);
    const wpPath=dijkstra(s,e);
    let full=[a];
    for(let idx of wpPath)full.push(WATER_WAYPOINTS[idx]);
    full.push(b);
    return full;
  }catch(err){return [a,b];}
}
function getWaterDist(a,b){
  try{
    const p=getWaterPath(a,b);
    let d=0;for(let i=1;i<p.length;i++)d+=haversine(p[i-1],p[i]);
    return d;
  }catch(err){return haversine(a,b);}
}
function totalDist(r,isCar){let d=0;for(let i=1;i<r.length;i++)d+= isCar?haversine(r[i-1],r[i]):getWaterDist(r[i-1],r[i]);return d;}
function nearestOrder(points,fn){if(points.length<=1)return points.slice();let idx=points.findIndex(p=>p.id===1);if(idx===-1)idx=0;let u=points.slice();let s=u.splice(idx,1)[0];let o=[s];while(u.length>0){let last=o[o.length-1];let best=0,bestD=fn(last,u[0]);for(let i=1;i<u.length;i++){let d=fn(last,u[i]);if(d<bestD){bestD=d;best=i;}}o.push(u.splice(best,1)[0]);}return o;}
function twoOptSwap(arr,i,k){return arr.slice(0,i).concat(arr.slice(i,k+1).reverse()).concat(arr.slice(k+1));}
function twoOpt(route,fn){if(route.length<4)return route;let best=route.slice();let bestDist=0;for(let i=1;i<best.length;i++)bestDist+=fn(best[i-1],best[i]);let imp=true,iter=0;while(imp&&iter<50){imp=false;for(let i=1;i<best.length-2;i++){for(let k=i+1;k<best.length-1;k++){let nr=twoOptSwap(best,i,k);let nd=0;for(let j=1;j<nr.length;j++)nd+=fn(nr[j-1],nr[j]);if(nd<bestDist-0.001){best=nr;bestDist=nd;imp=true;}}}iter++;}return best;}
function shortest(points,isCar){if(points.length<=2)return points;const fn=isCar?(a,b)=>haversine(a,b):getWaterDist;return twoOpt(nearestOrder(points,fn),fn);}
function passes(b,v){if(v==='all')return true;return b.vessels[v]===true;}
function adjClearance(base){return base + (FULL_LEVEL - lakeLevel);}
function statusFor(b){if(vessel==="all"||vessel==="car"||vessel==="pedestrian")return "pass";const adj=adjClearance(b.base);const req={pwc:{comfortable:6,marginal:4.5},smallboat:{comfortable:6,marginal:4},kayak:{comfortable:3,marginal:1.5}}[vessel];if(!req)return "pass";if(adj>=req.comfortable)return "pass";if(adj>=req.marginal)return "marginal";return "fail";}

function filteredWater(){
  let f=BRIDGES.filter(b=>{
    const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);
    if(!ok)return false;
    if(!passes(b,vessel))return false;
    const s=statusFor(b);
    if(s==="pass")return true;
    if(s==="marginal"&&includeMarginal)return true;
    return vessel==="all";
  });
  return shortest(f,false);
}
function filteredCar(){return BRIDGES.filter(b=>{const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);if(!ok)return false;return passes(b,vessel);});}

async function render(){
try{
const delta=FULL_LEVEL-lakeLevel;
document.getElementById('lakeLevelLabel').textContent=lakeLevel.toFixed(2);
document.getElementById('deltaLabel').textContent=(delta>=0?'+'+delta.toFixed(2):delta.toFixed(2))+'ft';

const isCar=vessel==='car';
let route= isCar? filteredCar() : filteredWater();
if(isCar && route.length>1){route=shortest(route,true);}

if(vessel==='pwc'){
  const directCount = (()=>{let c=0;for(let i=1;i<route.length;i++){if(isDirectWaterValid(route[i-1],route[i])) c++;}return c;})();
  const viaCount = route.length-1-directCount;
  const dist = totalDist(route,false);
  document.getElementById('bizerInfo').innerHTML=`<b>BIZER PWC Fix:</b> Your 12 stops / 63.8mi screenshot had hub-and-spoke for every leg. Now: ${directCount} DIRECT (no island crossing, inside lake polygon), ${viaCount} VIA BIZER CHANNEL (around Long Island N W5, Bear Island W W6, Center Harbor Neck, Alton-Wolfeboro peninsula). Alton (12) → Wolfeboro (10) now via Winter Harbor W11 around peninsula, not straight over land. Half Mile (1) → Suissevale (2) now via W0-W4 around Center Harbor Neck if direct crosses land. Distance should drop to ~35-45mi.`;
}

if(map){
markers.forEach(m=>{try{map.removeLayer(m)}catch(e){}});markers.clear();routeLines.forEach(l=>{try{map.removeLayer(l)}catch(e){}});routeLines=[];if(routeLine)try{map.removeLayer(routeLine)}catch(e){}
BRIDGES.forEach(b=>{const s=statusFor(b);const isIn=route.includes(b);const color=s==="pass"?"#16a34a":s==="marginal"?"#eab308":"#ef4444";const finalColor=vessel==="all"?(b.id===7?"#a855f7":"#16a34a"):color;const icon=L.divIcon({html:`<div style="background:${finalColor};width:28px;height:28px;border:3px solid white;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900;font-size:12px;opacity:${s==="fail"&&vessel!=="all"?0.3:isIn?1:0.5}">${isIn?route.indexOf(b)+1:b.id}</div>`,iconSize:[28,28],iconAnchor:[14,14]});const mk=L.marker([b.lat,b.lng],{icon}).addTo(map);mk.on('click',()=>openDetail(b.id));markers.set(b.id,mk);});
if(route.length>1){
if(isCar){
let full=[];for(let i=0;i<route.length;i++)full.push([route[i].lat,route[i].lng]);routeLine=L.polyline(full,{color:'#ea580c',weight:5,opacity:0.9}).addTo(map);
}else{
let fullPath=[];
for(let i=0;i<route.length;i++){
if(i>0){
const seg=getWaterPath(route[i-1],route[i]);
for(let j=1;j<seg.length-1;j++) fullPath.push([seg[j].lat,seg[j].lng]);
}
fullPath.push([route[i].lat,route[i].lng]);
}
routeLine=L.polyline(fullPath,{color:'#2563eb',weight:5,opacity:0.85}).addTo(map);
}
try{map.fitBounds(L.latLngBounds(route.map(b=>[b.lat,b.lng])).pad(0.18));}catch(e){}
}
}
let dist=totalDist(route,isCar);
document.getElementById('routeStats').textContent=`${route.length} stops • ${dist.toFixed(1)} mi ${isCar?'road':'Bizer water'}`;
document.getElementById('countBadge').textContent=`${route.length} / 20 • ${dist.toFixed(1)} mi`;
document.getElementById('list').innerHTML=route.map((b,idx)=>{
  const s=statusFor(b);const adj=adjClearance(b.base);
  const isDirect = idx<route.length-1 ? isDirectWaterValid(b, route[idx+1]) : true;
  return `<div class="bg-white rounded-[12px] border overflow-hidden shadow-sm cursor-pointer" onclick="openDetail(${b.id})"><div class="flex gap-0"><img src="${b.photo}" loading="lazy" class="w-[60px] h-[60px] object-cover shrink-0 m-2 rounded-lg" onerror="this.style.display='none'"><div class="p-2 flex-1 min-w-0"><div class="font-black text-[11px]">#${idx+1} ${b.name}</div><div class="text-[9px] text-zinc-600">${b.zone} • Adj ${adj.toFixed(1)}ft • ${s} ${isCar?'ROAD':'WATER'} ${!isCar && idx<route.length-1 ? (isDirect?'• DIRECT BIZER':'• VIA BIZER CHANNEL') : ''}</div><div class="text-[9px] mt-1"><span class="bg-zinc-900 text-white px-2 py-0.5 rounded-full text-[8px] font-bold">${idx < route.length-1 ? getWaterDist(b,route[idx+1]).toFixed(2)+' mi → next' : 'END'}</span></div></div></div></div>`;
}).join('');
}catch(err){console.error('render error',err);}
}

function openDetail(id){const b=BRIDGES.find(x=>x.id===id);if(!b)return;const f=vessel==='car'?filteredCar():filteredWater();const idx=f.findIndex(x=>x.id===id);if(map)map.flyTo([b.lat,b.lng],14);const adj=adjClearance(b.base);document.getElementById('detailInner').innerHTML=`<div class="p-3"><div class="flex justify-between"><div><div class="font-black text-[12px]">#${idx+1} ${b.name}</div><div class="text-[9px] bg-zinc-100 px-2 py-1 rounded-full mt-1">${b.zone} • Adj ${adj.toFixed(1)}ft</div></div><button onclick="closeDetail()" class="h-7 w-7 rounded-full bg-zinc-100 grid place-items-center">✕</button></div><img src="${b.photo}" class="w-full h-[180px] object-cover rounded-xl mt-2" loading="lazy"><div class="mt-2 text-[10px]"><b>Bizer:</b> Direct water when inside lake polygon and no island crossing, else via Bizer buoyed channels W5 Long Island N, W6 Bear Island W, W11 Winter Harbor S.</div></div>`;document.getElementById('detail').classList.remove('hidden');}
function closeDetail(){document.getElementById('detail').classList.add('hidden');}
window.openDetail=openDetail;window.closeDetail=closeDetail;
document.querySelectorAll('.vBtn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.vBtn').forEach(b=>b.className='vBtn px-2 h-6 rounded-full bg-zinc-100 font-bold text-[10px]');btn.className='vBtn px-2 h-6 rounded-full bg-black text-white font-bold text-[10px]';vessel=btn.dataset.v;render();});});
document.getElementById('lakeSlider').addEventListener('input',e=>{lakeLevel=parseFloat(e.target.value);render();});
document.getElementById('resetBtn').addEventListener('click',()=>{lakeLevel=FULL_LEVEL;document.getElementById('lakeSlider').value=FULL_LEVEL;render();});
document.getElementById('includeMarginal').addEventListener('change',e=>{includeMarginal=e.target.checked;render();});
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
document.getElementById('search').addEventListener('input',e=>{term=e.target.value.toLowerCase();render();});
function initMap(){
try{
map=L.map('map',{center:[43.60,-71.38],zoom:11});
L.control.zoom({position:'bottomright'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OSM'}).addTo(map);
osm.addTo(map);
setTimeout(()=>{try{map.invalidateSize();}catch(e){}},500);
}catch(err){document.getElementById('map').innerHTML='<div style="padding:20px;color:red">Map failed: '+err.message+'</div>';}
}
initMap();
setTimeout(()=>{try{render();}catch(e){console.error(e);}},800);
</script>
</body>
</html>
