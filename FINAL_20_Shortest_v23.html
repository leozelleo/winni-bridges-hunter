let vessel="all", term="", map, markers=new Map(), routeLine=null;
function haversine(a,b){const R=3958.8;const dLat=(b.lat-a.lat)*Math.PI/180;const dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function totalDist(r){let d=0;for(let i=1;i<r.length;i++)d+=haversine(r[i-1],r[i]);return d;}
function nearestNeighborOrder(b){if(b.length<=1)return b.slice();let idx=b.findIndex(x=>x.id===1);if(idx===-1)idx=0;let unvisited=b.slice();let start=unvisited.splice(idx,1)[0];let ordered=[start];while(unvisited.length>0){let last=ordered[ordered.length-1];let best=0,bestD=haversine(last,unvisited[0]);for(let i=1;i<unvisited.length;i++){let d=haversine(last,unvisited[i]);if(d<bestD){bestD=d;best=i;}}ordered.push(unvisited.splice(best,1)[0]);}return ordered;}
function twoOptSwapFixed(r,i,k){return r.slice(0,i).concat(r.slice(i,k+1).reverse()).concat(r.slice(k+1));}
function twoOpt(r){if(r.length<4)return r;let best=r.slice();let bestDist=totalDist(best);let improved=true,iter=0;while(improved&&iter<80){improved=false;for(let i=1;i<best.length-2;i++){for(let k=i+1;k<best.length-1;k++){let nr=twoOptSwapFixed(best,i,k);let nd=totalDist(nr);if(nd<bestDist-0.001){best=nr;bestDist=nd;improved=true;}}}iter++;}return best;}
function shortestRoute(b){if(b.length<=2)return b;return twoOpt(nearestNeighborOrder(b));}
function passes(b,v){if(v==='all')return true;return b.vessels[v]===true;}
function dotColor(b,v){if(v==='all')return b.id===7?'#a855f7':'#16a34a';return b.vessels[v]?'#16a34a':'#ef4444';}
function filtered(){let f=BRIDGES.filter(b=>{const s=(b.name+' '+b.zone+' '+b.type).toLowerCase();return (!term||s.includes(term))&&passes(b,vessel);});return shortestRoute(f);}
function render(){const f=filtered();if(map){markers.forEach(m=>{try{map.removeLayer(m)}catch(e){}});markers.clear();if(routeLine)try{map.removeLayer(routeLine)}catch(e){}if(f.length>1){const latlngs=f.map(b=>[b.lat,b.lng]);routeLine=L.polyline(latlngs,{color:'#2563eb',weight:5,opacity:0.9}).addTo(map);}f.forEach((b,idx)=>{const icon=L.divIcon({html:`<div style="background:${dotColor(b,vessel)};width:30px;height:30px;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5);display:grid;place-items:center;color:white;font-weight:900;font-size:13px">${idx+1}</div>`,iconSize:[30,30],iconAnchor:[15,15]});const mk=L.marker([b.lat,b.lng],{icon}).addTo(map).bindPopup(`<b>#${idx+1} ${b.name}</b><br>${b.zone} • ${b.clearance}<br>${b.lat.toFixed(5)}, ${b.lng.toFixed(5)}`);mk.on('click',()=>openDetail(b.id));markers.set(b.id,mk);});if(f.length>0){try{map.fitBounds(L.latLngBounds(f.map(b=>[b.lat,b.lng])).pad(0.18));}catch(e){}}}let dist=totalDist(f);document.getElementById('routeInfo').textContent=`${f.length} stops • ${dist.toFixed(1)} mi shortest • ${vessel.toUpperCase()}`;document.getElementById('countBadge').textContent=`${f.length} / 20 • ${dist.toFixed(1)} mi`;document.getElementById('list').innerHTML=f.map((b,idx)=>`
<div class="bg-white rounded-[14px] border overflow-hidden shadow-sm cursor-pointer hover:shadow-md" onclick="openDetail(${b.id})">
  <div class="flex gap-0">
    <img src="${b.photo}" class="w-[64px] h-[64px] object-cover shrink-0 m-2 rounded-lg">
    <div class="p-2 flex-1 min-w-0">
      <div class="font-black text-[12px] leading-tight">#${idx+1} ${b.name}</div>
      <div class="text-[10px] text-zinc-600 mt-0.5">${b.zone} • ${b.clearance} • ${b.lat.toFixed(4)}, ${b.lng.toFixed(4)}</div>
      <div class="text-[10px] mt-1"><span class="bg-zinc-900 text-white px-2 py-0.5 rounded-full text-[9px] font-bold">${idx < f.length-1 ? haversine(b,f[idx+1]).toFixed(2)+' mi → next' : 'END'}</span> <span class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[9px] font-bold ml-1">${vessel.toUpperCase()}</span></div>
    </div>
    <div class="w-1 self-stretch" style="background:${dotColor(b,vessel)}"></div>
  </div>
</div>`).join('') || `<div class="p-8 text-center text-[12px]">No match</div>`;}
function openDetail(id){const b=BRIDGES.find(x=>x.id===id);if(!b)return;const idx=filtered().findIndex(x=>x.id===id);if(map)map.flyTo([b.lat,b.lng],14);const rows=['car','pwc','smallboat','kayak','pedestrian'].map(v=>`<div class="flex justify-between py-2 border-b text-[12px]"><span class="font-bold">${v.toUpperCase()}</span><span style="color:${b.vessels[v]?'#16a34a':'#ef4444'};font-weight:800">${b.vessels[v]?'✓ Yes':'✕ No'}</span></div>`).join('');document.getElementById('detailInner').innerHTML=`<div class="p-4"><div class="flex justify-between"><div><div class="font-black text-[15px]">#${idx+1} ${b.name}</div><div class="text-[10px] bg-zinc-100 inline-block px-2 py-1 rounded-full mt-1">${b.zone} • ${b.clearance} • ${b.lat.toFixed(5)},${b.lng.toFixed(5)}</div></div><button onclick="closeDetail()" class="h-9 w-9 rounded-full bg-zinc-100 grid place-items-center">✕</button></div><div class="mt-3 border rounded-xl p-3">${rows}</div><div class="mt-3 grid grid-cols-2 gap-2"><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" class="h-11 grid place-items-center rounded-full bg-black text-white font-bold text-[13px]">Google Maps</a><a href="https://maps.apple.com/?daddr=${b.lat},${b.lng}" target="_blank" class="h-11 grid place-items-center rounded-full bg-zinc-100 border font-bold text-[13px]">Apple Maps</a></div></div>`;document.getElementById('detail').classList.remove('hidden');}
function closeDetail(){document.getElementById('detail').classList.add('hidden');}
window.openDetail=openDetail;window.closeDetail=closeDetail;
document.getElementById('search').addEventListener('input',e=>{term=e.target.value.toLowerCase();render();});
document.querySelectorAll('.vBtn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.vBtn').forEach(b=>b.className='vBtn px-3 h-8 rounded-full bg-zinc-100 font-bold text-[11px]');btn.className='vBtn px-3 h-8 rounded-full bg-black text-white font-bold text-[11px]';vessel=btn.dataset.v;render();});});
document.getElementById('gpxBtn').addEventListener('click',()=>{const f=filtered();let gpx=`<?xml version="1.0"?><gpx><name>Winni ${vessel} ${f.length} stops ${totalDist(f).toFixed(1)} mi shortest v23</name>`;f.forEach(b=>{gpx+=`<wpt lat="${b.lat}" lon="${b.lng}"><name>${b.id}. ${b.name}</name><desc>${b.clearance} ${b.zone}</desc></wpt>`;});gpx+=`</gpx>`;const blob=new Blob([gpx],{type:'application/gpx+xml'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`winnipesaukee_${vessel}_shortest_v23.gpx`;a.click();});
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
function initMap(){map=L.map('map',{center:[43.60,-71.38],zoom:11});L.control.zoom({position:'bottomright'}).addTo(map);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});L.control.layers({"Streets":osm,"Satellite":sat}).addTo(map);setTimeout(()=>map.invalidateSize(),400);}
initMap();render();
</script>
