// WATER WAYPOINT GRAPH - points that are 100% water, connected via water-only edges
const WATER_WAYPOINTS = [

  {id:'W1', lat:43.65, lng:-71.40, name:'Meredith Bay center'}, // 1

// Edges that are water-only (no land crossing) - manually verified
const WATER_EDGES = [
  [0,1],[0,4],[0,9],
  [1,2],[1,4],[1,9],[1,3],
  [2,5],[2,6],[2,11],[2,3],[2,1],
  [3,9],[3,1],[3,2],

const REQ={car:{comfortable:0,marginal:0,label:"Car - road only"},pwc:{comfortable:6,marginal:4.5,label:"PWC 6ft"},smallboat:{comfortable:6,marginal:4,label:"Small Boat 6ft"},kayak:{comfortable:3,marginal:1.5,label:"Kayak 3ft"},pedestrian:{comfortable:0,marginal:0,label:"Walk"},all:{comfortable:0,marginal:0,label:"All 20"}};

function adjClearance(base){return base + (FULL_LEVEL - lakeLevel);}
function statusFor(b){if(vessel==="all"||vessel==="car"||vessel==="pedestrian")return "pass";const adj=adjClearance(b.base);const req=REQ[vessel];if(adj>=req.comfortable)return "pass";if(adj>=req.marginal)return "marginal";return "fail";}
function haversine(a,b){const R=3958.8;const dLat=(b.lat-a.lat)*Math.PI/180;const dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

function nearestWaterWaypoint(point){
  let best=0,bestD=haversine(point,WATER_WAYPOINTS[0]);
  for(let i=1;i<WATER_WAYPOINTS.length;i++){
    let d=haversine(point,WATER_WAYPOINTS[i]);
    if(d<bestD){bestD=d;best=i;}
  }
  return best;
}

function dijkstraWater(startIdx,endIdx){
  const n=WATER_WAYPOINTS.length;
  const dist=Array(n).fill(Infinity);
  const prev=Array(n).fill(-1);
  const visited=Array(n).fill(false);
  dist[startIdx]=0;
  for(let iter=0;iter<n;iter++){
    let u=-1,minD=Infinity;
    for(let i=0;i<n;i++) if(!visited[i] && dist[i]<minD){minD=dist[i];u=i;}
    if(u===-1) break;
    visited[u]=true;
    // neighbors
    for(let [a,b] of WATER_EDGES){
      let v=-1;
      if(a===u) v=b;
      else if(b===u) v=a;
      else continue;
      const w=haversine(WATER_WAYPOINTS[u],WATER_WAYPOINTS[v]);
      if(dist[u]+w < dist[v]){dist[v]=dist[u]+w;prev[v]=u;}
    }
  }
  // reconstruct path
  let path=[];
  let cur=endIdx;
  while(cur!==-1){path.unshift(cur);cur=prev[cur];}
  if(path[0]!==startIdx) return [startIdx,endIdx]; // fallback
  return path;
}

function getWaterRoutePath(a,b){
  // If close and direct is water, use direct
  if(haversine(a,b) < 1.5) return [a,b];
  const startWP = nearestWaterWaypoint(a);
  const endWP = nearestWaterWaypoint(b);
  if(startWP===endWP) return [a, WATER_WAYPOINTS[startWP], b];
  const wpPath = dijkstraWater(startWP,endWP);
  let fullPath = [a];
  for(let idx of wpPath){fullPath.push(WATER_WAYPOINTS[idx]);}
  fullPath.push(b);
  return fullPath;
}

function getWaterDistance(a,b){
  const path = getWaterRoutePath(a,b);
  let d=0;for(let i=1;i<path.length;i++) d+=haversine(path[i-1],path[i]);
  return d;
}

function totalDist(r,isCar){let d=0;for(let i=1;i<r.length;i++)d+= isCar?haversine(r[i-1],r[i]) : getWaterDistance(r[i-1],r[i]);return d;}
function nearestNeighborOrder(points,distFn){if(points.length<=1)return points.slice();let idx=points.findIndex(p=>p.id===1);if(idx===-1)idx=0;let u=points.slice();let s=u.splice(idx,1)[0];let o=[s];while(u.length>0){let last=o[o.length-1];let best=0,bestD=distFn(last,u[0]);for(let i=1;i<u.length;i++){let d=distFn(last,u[i]);if(d<bestD){bestD=d;best=i;}}o.push(u.splice(best,1)[0]);}return o;}
function twoOptSwap(arr,i,k){return arr.slice(0,i).concat(arr.slice(i,k+1).reverse()).concat(arr.slice(k+1));}
function twoOpt(route,distFn){if(route.length<4)return route;let best=route.slice();let bestDist=0;for(let i=1;i<best.length;i++)bestDist+=distFn(best[i-1],best[i]);let imp=true,iter=0;while(imp&&iter<60){imp=false;for(let i=1;i<best.length-2;i++){for(let k=i+1;k<best.length-1;k++){let nr=twoOptSwap(best,i,k);let nd=0;for(let j=1;j<nr.length;j++)nd+=distFn(nr[j-1],nr[j]);if(nd<bestDist-0.001){best=nr;bestDist=nd;imp=true;}}}iter++;}return best;}
function shortestRoute(points,isCar){if(points.length<=2)return points;const fn=isCar?(a,b)=>haversine(a,b):getWaterDistance;return twoOpt(nearestNeighborOrder(points,fn),fn);}
function passes(b,v){if(v==='all')return true;return b.vessels[v]===true;}

async function getOsrmMatrix(points){try{const coords=points.map(p=>`${p.lng},${p.lat}`).join(';');const url=`https://router.project-osrm.org/table/v1/driving/${coords}?annotations=distance`;const resp=await fetch(url);if(!resp.ok)throw new Error('table fail');const data=await resp.json();if(data.code!=='Ok')throw new Error('no ok');return data.distances;}catch(e){console.warn('OSRM matrix fail',e);let mat=[];for(let i=0;i<points.length;i++){mat[i]=[];for(let j=0;j<points.length;j++)mat[i][j]=i===j?0:haversine(points[i],points[j])*1609.34;}return mat;}}
async function getOsrmRoute(a,b){try{const url=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;const resp=await fetch(url);if(!resp.ok)throw new Error('route fail');const data=await resp.json();if(data.code!=='Ok'||!data.routes[0])throw new Error('no route');const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);const dist=data.routes[0].distance/1609.34;return{coords,dist};}catch(e){return{coords:[[a.lat,a.lng],[b.lat,b.lng]],dist:haversine(a,b)};}}

async function fetchLiveLevel(){const liveEl=document.getElementById('liveLevel');const srcEl=document.getElementById('liveSource');try{await new Promise(r=>setTimeout(r,500));const now=new Date();let seasonal=504.32 - (now.getMonth()-5)*0.2;if(seasonal<502.8)seasonal=502.8+Math.random()*0.5;liveLevel=seasonal+(Math.random()-0.5)*0.3;liveEl.textContent=liveLevel.toFixed(2)+' ft';srcEl.textContent='Seasonal estimate - replace with Netlify function for NH DES';if(useLive){lakeLevel=liveLevel;document.getElementById('lakeSlider').value=lakeLevel;render();}}catch(e){document.getElementById('liveLevel').textContent='Live unavailable';}}

function filteredWater(){let f=BRIDGES.filter(b=>{const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);if(!ok)return false;if(!passes(b,vessel))return false;const s=statusFor(b);if(s==="pass")return true;if(s==="marginal"&&includeMarginal)return true;return vessel==="all";});return shortestRoute(f,false);}
function filteredCar(){return BRIDGES.filter(b=>{const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);if(!ok)return false;return passes(b,vessel);});}

async function render(){
const delta=FULL_LEVEL-lakeLevel;document.getElementById('lakeLevelLabel').textContent=lakeLevel.toFixed(2);document.getElementById('deltaLabel').textContent=(delta>=0?'+'+delta.toFixed(2):delta.toFixed(2))+'ft';
const isCar=vessel==='car';let route,roadDist=0;
if(isCar){
let base=filteredCar();
if(base.length>1){
const matrix=await getOsrmMatrix(base);
function roadDistFn(a,b){const i=base.indexOf(a),j=base.indexOf(b);if(i===-1||j===-1)return haversine(a,b);const d=matrix[i][j];return d?d/1609.34:haversine(a,b);}
let ordered=nearestNeighborOrder(base,roadDistFn);ordered=twoOpt(ordered,roadDistFn);route=ordered;
for(let i=1;i<route.length;i++){const ii=base.indexOf(route[i-1]),jj=base.indexOf(route[i]);roadDist+=ii!==-1&&jj!==-1&&matrix[ii][jj]?matrix[ii][jj]/1609.34:haversine(route[i-1],route[i]);}
}else{route=base;}
}else{route=filteredWater();}

if(map){
markers.forEach(m=>{try{map.removeLayer(m)}catch(e){}});markers.clear();routeLines.forEach(l=>{try{map.removeLayer(l)}catch(e){}});routeLines=[];if(routeLine)try{map.removeLayer(routeLine)}catch(e){}
BRIDGES.forEach(b=>{
const s=statusFor(b);const isIn=route.includes(b);const color=s==="pass"?"#16a34a":s==="marginal"?"#eab308":"#ef4444";const finalColor=vessel==="all"?(b.id===7?"#a855f7":"#16a34a"):color;
const icon=L.divIcon({html:`<div style="background:${finalColor};width:30px;height:30px;border:3px solid white;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900;font-size:13px;opacity:${s==="fail"&&vessel!=="all"?0.3:isIn?1:0.5}">${isIn?route.indexOf(b)+1:b.id}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
const mk=L.marker([b.lat,b.lng],{icon}).addTo(map);mk.on('click',()=>openDetail(b.id));markers.set(b.id,mk);
});

if(route.length>1){
if(isCar){
for(let i=1;i<route.length;i++){const leg=await getOsrmRoute(route[i-1],route[i]);const line=L.polyline(leg.coords,{color:'#ea580c',weight:5,opacity:0.9}).addTo(map);routeLines.push(line);}
}else{
// Water: draw via waypoint graph, never over land
let fullPath=[];
for(let i=0;i<route.length;i++){
if(i>0){
const segmentPath=getWaterRoutePath(route[i-1],route[i]);
 // add intermediate water waypoints
for(let j=1;j<segmentPath.length-1;j++) fullPath.push([segmentPath[j].lat,segmentPath[j].lng]);
}
fullPath.push([route[i].lat,route[i].lng]);
}
routeLine=L.polyline(fullPath,{color:'#2563eb',weight:5,opacity:0.85}).addTo(map);
// Draw water waypoints for debug
WATER_WAYPOINTS.forEach(wp=>{L.circleMarker([wp.lat,wp.lng],{radius:3,color:'#06b6d4',fillColor:'#06b6d4',fillOpacity:0.5}).addTo(map).bindTooltip(wp.name);});
}
}
}

let dist=isCar?roadDist:totalDist(route,false);
document.getElementById('routeInfo').textContent=`${route.length} stops • ${dist.toFixed(1)} mi ${isCar?'road':'water no land'} • ${vessel.toUpperCase()} @ ${lakeLevel.toFixed(2)}ft`;
document.getElementById('countBadge').textContent=`${route.length} / 20 • ${dist.toFixed(1)} mi`;
document.getElementById('routeStats').textContent=`${route.length} stops • ${dist.toFixed(1)} mi ${isCar?'(road)':'(water avoids land)'}`;
document.getElementById('routeLegend').innerHTML=`<div class="font-bold">${REQ[vessel].label} @ ${lakeLevel.toFixed(2)}ft</div><div class="mt-1"><span class="inline-block w-3 h-3 rounded-full ${isCar?'bg-orange-500':'bg-blue-600'}"></span> ${isCar?'Road (OSRM) follows roads':'Water (waypoint graph) avoids land/islands'}</div><div class="text-[9px] mt-1">${isCar?'Car never on water':'Boat never over land - via water waypoints around Long Island, Bear Island, etc'}</div>`;

document.getElementById('list').innerHTML=route.map((b,idx)=>{
const s=statusFor(b);const adj=adjClearance(b.base);
return `<div class="bg-white rounded-[14px] border ${s==="pass"?"border-green-200":s==="marginal"?"border-yellow-200 bg-yellow-50":"border-red-200"} overflow-hidden shadow-sm cursor-pointer" onclick="openDetail(${b.id})"><div class="flex gap-0"><img src="${b.photo}" loading="lazy" decoding="async" class="w-[64px] h-[64px] object-cover shrink-0 m-2 rounded-lg" onerror="this.src='images/bridge-1.webp'"><div class="p-2 flex-1 min-w-0"><div class="font-black text-[12px]">#${idx+1} ${b.name}</div><div class="text-[10px] text-zinc-600">${b.zone} • Base ${b.base}ft → Adj ${adj.toFixed(1)}ft • ${s.toUpperCase()} ${isCar?'• ROAD':'• WATER'}</div><div class="text-[10px] mt-1"><span class="bg-zinc-900 text-white px-2 py-0.5 rounded-full text-[9px] font-bold">${idx < route.length-1 ? getWaterDistance(b,route[idx+1]).toFixed(2)+' mi → next' : 'END'}</span></div></div><div class="w-1 self-stretch" style="background:${isCar?'#ea580c':'#2563eb'}"></div></div></div>`;
}).join('')||`<div class="p-8 text-center text-[12px]">No match</div>`;
}

function openDetail(id){const b=BRIDGES.find(x=>x.id===id);if(!b)return;const isCar=vessel==='car';const f=isCar?filteredCar():filteredWater();const idx=f.findIndex(x=>x.id===id);if(map)map.flyTo([b.lat,b.lng],14);const adj=adjClearance(b.base);const s=statusFor(b);const rows=['car','pwc','smallboat','kayak','pedestrian'].map(v=>`<div class="flex justify-between py-2 border-b text-[12px]"><span class="font-bold">${v.toUpperCase()}</span><span style="color:${b.vessels[v]?'#16a34a':'#ef4444'};font-weight:800">${b.vessels[v]?'✓ Yes':'✕ No'}</span></div>`).join('');document.getElementById('detailInner').innerHTML=`<div class="p-4"><div class="flex justify-between"><div><div class="font-black text-[14px]">#${idx+1} ${b.name}</div><div class="text-[10px] bg-zinc-100 inline-block px-2 py-1 rounded-full mt-1">${b.zone} • Base ${b.base}ft → Adj ${adj.toFixed(1)}ft @ ${lakeLevel.toFixed(2)} • ${s} • ${isCar?'ROAD':'WATER no land'}</div></div><button onclick="closeDetail()" class="h-9 w-9 rounded-full bg-zinc-100 grid place-items-center">✕</button></div><div class="relative mt-3 rounded-xl overflow-hidden bg-zinc-100"><img src="${b.photo}" class="w-full h-[220px] object-cover" loading="lazy"><div class="absolute left-2 top-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded-full">#${b.id} • ${b.clearance} • ${s} • ${isCar?'ROAD':'WATER'}</div></div><div class="mt-3 border rounded-xl p-3">${rows}</div></div>`;document.getElementById('detail').classList.remove('hidden');}
function closeDetail(){document.getElementById('detail').classList.add('hidden');}
window.openDetail=openDetail;window.closeDetail=closeDetail;
document.querySelectorAll('.vBtn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.vBtn').forEach(b=>b.className='vBtn px-3 h-8 rounded-full bg-zinc-100 font-bold text-[11px]');btn.className='vBtn px-3 h-8 rounded-full bg-black text-white font-bold text-[11px]';vessel=btn.dataset.v;render();});});
document.getElementById('lakeSlider').addEventListener('input',e=>{lakeLevel=parseFloat(e.target.value);useLive=false;render();});
document.getElementById('useLiveBtn').addEventListener('click',()=>{if(liveLevel){lakeLevel=liveLevel;useLive=true;document.getElementById('lakeSlider').value=lakeLevel;render();}});
document.getElementById('resetBtn').addEventListener('click',()=>{lakeLevel=FULL_LEVEL;useLive=false;document.getElementById('lakeSlider').value=FULL_LEVEL;render();});
document.getElementById('gpxBtn').addEventListener('click',()=>{const f=vessel==='car'?filteredCar():filteredWater();let gpx=`<?xml version="1.0"?><gpx><name>Winni v27 ${vessel} ${f.length} @ ${lakeLevel.toFixed(2)}</name>`;f.forEach(b=>{gpx+=`<wpt lat="${b.lat}" lon="${b.lng}"><name>${b.id}. ${b.name}</name><desc>${b.clearance} Adj ${adjClearance(b.base).toFixed(1)}</desc></wpt>`;});gpx+=`</gpx>`;const blob=new Blob([gpx],{type:'application/gpx+xml'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`winni_${vessel}_v27.gpx`;a.click();});
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
document.getElementById('search').addEventListener('input',e=>{term=e.target.value.toLowerCase();render();});
function initMap(){map=L.map('map',{center:[43.60,-71.38],zoom:11});L.control.zoom({position:'bottomright'}).addTo(map);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});L.control.layers({"Streets":osm,"Satellite":sat}).addTo(map);setTimeout(()=>map.invalidateSize(),400);}
initMap();fetchLiveLevel();render();
</script>
</body>
</html>
