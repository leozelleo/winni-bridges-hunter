  </div>
</div>

const FULL_LEVEL = 504.32;
const LAKE_CENTER = {lat: 43.60, lng: -71.38};
const LAKE_WATER_POLYGON = [
  [43.71, -71.50], [43.73, -71.42], [43.74, -71.35], [43.72, -71.30], [43.68, -71.28], [43.62, -71.29], [43.56, -71.32], [43.50, -71.30], [43.46, -71.26], [43.46, -71.22], [43.48, -71.18], [43.52, -71.20], [43.56, -71.25], [43.58, -71.33], [43.58, -71.40], [43.60, -71.45], [43.65, -71.48], [43.71, -71.50]
];

let vessel="all", term="", map, markers=new Map(), routeLine=null, routeLines=[], lakeLevel=FULL_LEVEL, includeMarginal=true;

const REQ = {
  car: {comfortable: 0, marginal: 0, label: "Car - road only, no clearance check"},
  pwc: {comfortable: 6, marginal: 4.5, label: "PWC needs 6ft standing, 4.5ft lay flat - water only"},
  smallboat: {comfortable: 6, marginal: 4, label: "Small Boat needs 6ft bimini down, 4ft marginal - water only"},
  kayak: {comfortable: 3, marginal: 1.5, label: "Kayak needs 3ft comfortable, 1.5ft duck - water only"},
  pedestrian: {comfortable: 0, marginal: 0, label: "Walk - footbridges - water only"},
  all: {comfortable: 0, marginal: 0, label: "All 20 - no filter"}
};

function adjClearance(base){ return base + (FULL_LEVEL - lakeLevel); }
function statusFor(b){ if(vessel==="all" || vessel==="car" || vessel==="pedestrian") return "pass"; const adj=adjClearance(b.base); const req=REQ[vessel]; if(adj>=req.comfortable) return "pass"; if(adj>=req.marginal) return "marginal"; return "fail"; }

function haversine(a,b){const R=3958.8;const dLat=(b.lat-a.lat)*Math.PI/180;const dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

function isPointInPolygon(point, polygon) {
  const x = point.lng, y = point.lat;
  let inside = false;
  for (let i=0, j=polygon.length-1; i<polygon.length; j=i++) {
    const xi = polygon[i][1], yi = polygon[i][0];
    const xj = polygon[j][1], yj = polygon[j][0];
    const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function isWaterRouteValid(a,b) {
  const mid = {lat: (a.lat+b.lat)/2, lng: (a.lng+b.lng)/2};
  if (isPointInPolygon(mid, LAKE_WATER_POLYGON)) return true;
  if (haversine(mid, LAKE_CENTER) < 5) return true;
  return false;
}

function getWaterDistance(a,b) {
  if (isWaterRouteValid(a,b)) {
    return haversine(a,b);
  } else {
    return haversine(a, LAKE_CENTER) + haversine(LAKE_CENTER, b);
  }
}

function totalDist(route, isCar) {
  if (isCar) {
    let d=0; for(let i=1;i<route.length;i++) d+=haversine(route[i-1],route[i]); return d;
  } else {
    let d=0; for(let i=1;i<route.length;i++) d+=getWaterDistance(route[i-1],route[i]); return d;
  }
}

function nearestNeighborOrder(points, distanceFn) {
  if(points.length<=1) return points.slice();
  let idx = points.findIndex(p=>p.id===1);
  if(idx===-1) idx=0;
  let unvisited = points.slice();
  let start = unvisited.splice(idx,1)[0];
  let ordered=[start];
  while(unvisited.length>0) {
    let last=ordered[ordered.length-1];
    let best=0, bestD=distanceFn(last, unvisited[0]);
    for(let i=1;i<unvisited.length;i++) {
      let d=distanceFn(last, unvisited[i]);
      if(d<bestD){bestD=d; best=i;}
    }
    ordered.push(unvisited.splice(best,1)[0]);
  }
  return ordered;
}

function twoOptSwap(arr,i,k){ return arr.slice(0,i).concat(arr.slice(i,k+1).reverse()).concat(arr.slice(k+1)); }

function twoOpt(route, distanceFn) {
  if(route.length<4) return route;
  let best=route.slice();
  let bestDist=0; for(let i=1;i<best.length;i++) bestDist+=distanceFn(best[i-1],best[i]);
  let improved=true, iter=0;
  while(improved && iter<80) {
    improved=false;
    for(let i=1;i<best.length-2;i++) {
      for(let k=i+1;k<best.length-1;k++) {
        let newRoute=twoOptSwap(best,i,k);
        let nd=0; for(let j=1;j<newRoute.length;j++) nd+=distanceFn(newRoute[j-1],newRoute[j]);
        if(nd < bestDist - 0.001){ best=newRoute; bestDist=nd; improved=true; }
      }
    }
    iter++;
  }
  return best;
}

function shortestRoute(points, isCar) {
  if(points.length<=2) return points;
  const distFn = isCar ? ((a,b)=>haversine(a,b)) : getWaterDistance;
  return twoOpt(nearestNeighborOrder(points, distFn), distFn);
}

async function getOsrmMatrix(points) {
  try {
    const coords = points.map(p=>`${p.lng},${p.lat}`).join(';');
    const url = `https://router.project-osrm.org/table/v1/driving/${coords}?annotations=distance`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('OSRM table failed');
    const data = await resp.json();
    if(data.code!=='Ok' || !data.distances) throw new Error('OSRM no distances');
    return data.distances;
  } catch(e) {
    console.warn('OSRM matrix failed, fallback to haversine', e);
    let mat=[]; for(let i=0;i<points.length;i++){ mat[i]=[]; for(let j=0;j<points.length;j++){ mat[i][j]= i===j?0:haversine(points[i],points[j])*1609.34; } } return mat;
  }
}

async function getOsrmRoute(a,b) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('OSRM route failed');
    const data = await resp.json();
    if(data.code!=='Ok' || !data.routes || !data.routes[0]) throw new Error('No route');
    const coords = data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    const dist = data.routes[0].distance / 1609.34;
    return {coords, dist};
  } catch(e) {
    console.warn('OSRM route failed, fallback to straight', e);
    return {coords: [[a.lat,a.lng],[b.lat,b.lng]], dist: haversine(a,b)};
  }
}

function passes(b,v){if(v==='all')return true;return b.vessels[v]===true;}

function filteredRouteWater() {
  let filtered = BRIDGES.filter(b=>{
    const termOk = !term || (b.name+' '+b.zone+' '+b.type).toLowerCase().includes(term);
    if(!termOk) return false;
    if(!passes(b,vessel)) return false;
    const s=statusFor(b);
    if(s==="pass") return true;
    if(s==="marginal" && includeMarginal) return true;
    return vessel==="all";
  });
  return shortestRoute(filtered, false);
}

function filteredRouteCar() {
  let filtered = BRIDGES.filter(b=>{
    const termOk = !term || (b.name+' '+b.zone+' '+b.type).toLowerCase().includes(term);
    if(!termOk) return false;
    return passes(b,vessel);
  });
  return filtered;
}

async function render() {
  const delta = FULL_LEVEL - lakeLevel;
  document.getElementById('lakeLevelLabel').textContent = lakeLevel.toFixed(2);
  document.getElementById('deltaLabel').textContent = (delta>=0?`+${delta.toFixed(2)}ft clearance`:`${delta.toFixed(2)}ft clearance`) + (delta>0?' (low water)':' (high water)');
  document.getElementById('deltaLabel').className = delta>=0?'text-green-600 font-bold text-[11px]':'text-red-600 font-bold text-[11px]';
  
  const isCar = vessel==='car';
  let route;
  let roadDistTotal = 0;
  
  if(isCar) {
    document.getElementById('loadingBadge').classList.remove('hidden');
    let baseFiltered = filteredRouteCar();
    if(baseFiltered.length>1) {
      const matrix = await getOsrmMatrix(baseFiltered);
      function roadDist(a,b) {
        const i=baseFiltered.indexOf(a), j=baseFiltered.indexOf(b);
        if(i===-1||j===-1) return haversine(a,b);
        const d = matrix[i][j];
        return d ? d/1609.34 : haversine(a,b);
      }
      let ordered = nearestNeighborOrder(baseFiltered, roadDist);
      ordered = twoOpt(ordered, roadDist);
      route = ordered;
      for(let i=1;i<route.length;i++) {
        const ii=baseFiltered.indexOf(route[i-1]), jj=baseFiltered.indexOf(route[i]);
        roadDistTotal += ii!==-1&&jj!==-1&&matrix[ii][jj] ? matrix[ii][jj]/1609.34 : haversine(route[i-1],route[i]);
      }
    } else {
      route = baseFiltered;
    }
    document.getElementById('loadingBadge').classList.add('hidden');
  } else {
    route = filteredRouteWater();
  }
  
  const all = BRIDGES;
  
  if(map) {
    markers.forEach(m=>{try{map.removeLayer(m)}catch(e){}}); markers.clear();
    routeLines.forEach(l=>{try{map.removeLayer(l)}catch(e){}}); routeLines=[];
    if(routeLine) try{map.removeLayer(routeLine)}catch(e){}
    
    all.forEach(b=>{
      const s=statusFor(b);
      const adj=adjClearance(b.base);
      let color="#000";
      if(vessel!=="all") {
        if(s==="pass") color="#16a34a";
        else if(s==="marginal") color="#eab308";
        else color="#ef4444";
      } else {
        color = b.id===7 ? "#a855f7" : "#16a34a";
      }
      const isInRoute = route.includes(b);
      const icon=L.divIcon({html:`<div style="background:${color};width:28px;height:28px;border:3px solid white;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;color:white;opacity:${s==="fail"&&vessel!=="all"?0.4:isInRoute?1:0.5}">${isInRoute?route.indexOf(b)+1:b.id}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
      const mk=L.marker([b.lat,b.lng],{icon}).addTo(map).bindPopup(`<b>${b.name}</b><br>Base ${b.base}ft → Adj ${adj.toFixed(1)}ft @ ${lakeLevel.toFixed(2)}<br>${s}<br>${isCar?'Road route':'Water route'}`);
      mk.on('click',()=>openDetail(b.id));
      markers.set(b.id,mk);
    });
    
    if(route.length>1) {
      if(isCar) {
        for(let i=1;i<route.length;i++) {
          const leg = await getOsrmRoute(route[i-1], route[i]);
          const line = L.polyline(leg.coords, {color: '#ea580c', weight: 5, opacity: 0.9}).addTo(map);
          routeLines.push(line);
        }
      } else {
        let finalPath=[];
        for(let i=0;i<route.length;i++) {
          if(i>0) {
            const a=route[i-1], b=route[i];
            if(!isWaterRouteValid(a,b)) {
              finalPath.push([LAKE_CENTER.lat, LAKE_CENTER.lng]);
            }
          }
          finalPath.push([route[i].lat, route[i].lng]);
        }
        routeLine = L.polyline(finalPath, {color: '#2563eb', weight: 5, opacity: 0.85}).addTo(map);
      }
    }
  }
  
  let dist = isCar ? roadDistTotal : totalDist(route,false);
  document.getElementById('routeInfo').textContent = `${route.length} stops • ${dist.toFixed(1)} mi ${isCar?'road':'water shortest'} • ${vessel.toUpperCase()}`;
  document.getElementById('countBadge').textContent = `${route.length} / 20 • ${dist.toFixed(1)} mi`;
  document.getElementById('routeStats').textContent = `${route.length} stops • ${dist.toFixed(1)} mi ${isCar?'(road)':'(water)'}`;
  document.getElementById('routeLegend').innerHTML = `
    <div class="font-bold mb-1">${REQ[vessel].label} @ ${lakeLevel.toFixed(2)}ft</div>
    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full ${isCar?'bg-orange-500':'bg-blue-600'}"></span> ${isCar?'Car road route (OSRM)':'Water route (stays on water)'}</div>
    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-500"></span> Pass</div>
    ${!isCar?`<div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-yellow-500"></span> Marginal (duck)</div><div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-red-500"></span> No go - skipped</div>`:''}
    <div class="mt-1 text-[9px]">${isCar?'Car follows roads, not water':'Watercraft stays on water, via lake center if needed'}<br>Adj = base + (504.32 - lake)</div>
  `;
  
  document.getElementById('list').innerHTML = route.map((b,idx)=>{
    const s=statusFor(b); const adj=adjClearance(b.base); const nextDist = idx < route.length-1 ? (isCar ? 'road' : getWaterDistance(b, route[idx+1]).toFixed(2)+' mi → next') : 'END';
    return `
    <div class="bg-white rounded-[14px] border ${s==="pass"?"border-green-300":s==="marginal"?"border-yellow-300 bg-yellow-50":s==="fail"?"border-red-200 bg-red-50 opacity-60":"border-zinc-200"} overflow-hidden shadow-sm cursor-pointer" onclick="openDetail(${b.id})">
      <div class="flex gap-2"><img src="${b.photo}" class="w-[64px] h-[64px] object-cover shrink-0 m-2 rounded-lg"><div class="p-2 flex-1 min-w-0"><div class="font-black text-[12px] leading-tight">#${idx+1} ${b.name}</div><div class="text-[10px] text-zinc-600">${b.zone} • Base ${b.base}ft → Adj ${adj.toFixed(1)}ft • ${s.toUpperCase()} ${isCar?'• ROAD':'• WATER'}</div><div class="text-[10px] mt-1"><span class="bg-zinc-900 text-white px-2 py-0.5 rounded-full text-[9px] font-bold">${typeof nextDist==='string' ? nextDist : nextDist.toFixed(2)+' mi → next'}</span> <span class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[9px] font-bold ml-1">${vessel.toUpperCase()}</span></div></div><div class="w-1 self-stretch" style="background:${isCar?'#ea580c':'#2563eb'}"></div></div>
    </div>`;
  }).join('') || `<div class="p-8 text-center text-[12px]">No match - try include marginal or lower lake level</div>`;
}

function openDetail(id){const b=BRIDGES.find(x=>x.id===id);if(!b)return;const f=BRIDGES.filter(bb=>passes(bb,vessel));const isCar=vessel==='car';const route=isCar?[]:filteredRouteWater();const idx=isCar?f.findIndex(x=>x.id===id):route.findIndex(x=>x.id===id);if(map)map.flyTo([b.lat,b.lng],14);const adj=adjClearance(b.base);const s=statusFor(b);const rows=['car','pwc','smallboat','kayak','pedestrian'].map(v=>`<div class="flex justify-between py-2 border-b text-[12px]"><span class="font-bold">${v.toUpperCase()}</span><span style="color:${b.vessels[v]?'#16a34a':'#ef4444'};font-weight:800">${b.vessels[v]?'✓ Yes':'✕ No'}</span></div>`).join('');document.getElementById('detailInner').innerHTML=`<div class="p-4"><div class="flex justify-between"><div><div class="font-black text-[15px]">#${idx+1>=0?idx+1:b.id} ${b.name}</div><div class="text-[10px] bg-zinc-100 inline-block px-2 py-1 rounded-full mt-1">${b.zone} • Base ${b.base}ft → Adj ${adj.toFixed(1)}ft @ ${lakeLevel.toFixed(2)} • ${s.toUpperCase()} • ${isCar?'ROAD':'WATER'}</div></div><button onclick="closeDetail()" class="h-9 w-9 rounded-full bg-zinc-100 grid place-items-center">✕</button></div><div class="mt-3 border rounded-xl p-3">${rows}<div class="text-[10px] bg-zinc-50 p-2 rounded mt-2">Car follows roads via OSRM, watercraft stays on water via center if needed. Formula: Adj = Base + (504.32 - lake)</div></div><div class="grid grid-cols-2 gap-2 mt-3"><a href="https://maps.apple.com/?daddr=${b.lat},${b.lng}" target="_blank" class="h-11 grid place-items-center rounded-full bg-black text-white font-bold text-[13px]">Apple Maps</a><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" class="h-11 grid place-items-center rounded-full bg-white border font-bold text-[13px]">Google</a></div></div>`;document.getElementById('detail').classList.remove('hidden');}
function closeDetail(){document.getElementById('detail').classList.add('hidden');}
window.openDetail=openDetail;window.closeDetail=closeDetail;

function initMap(){map=L.map('map',{center:[43.60,-71.38],zoom:11});L.control.zoom({position:'bottomright'}).addTo(map);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});L.control.layers({"Streets":osm,"Satellite":sat}).addTo(map);setTimeout(()=>map.invalidateSize(),400);}

document.querySelectorAll('.vBtn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.vBtn').forEach(b=>b.className='vBtn px-3 h-8 rounded-full bg-zinc-100 font-bold text-[11px]');btn.className='vBtn px-3 h-8 rounded-full bg-black text-white font-bold text-[11px]';vessel=btn.dataset.v;render();});});
document.getElementById('lakeSlider').addEventListener('input',e=>{lakeLevel=parseFloat(e.target.value);render();});
document.getElementById('includeMarginal').addEventListener('change',e=>{includeMarginal=e.target.checked;render();});
document.getElementById('gpxBtn').addEventListener('click',()=>{const f=vessel==='car'?BRIDGES.filter(b=>passes(b,vessel)):filteredRouteWater();let gpx=`<?xml version="1.0"?><gpx><name>Winni v24 ${vessel} ${f.length} stops @ ${lakeLevel.toFixed(2)}ft</name>`;f.forEach(b=>{gpx+=`<wpt lat="${b.lat}" lon="${b.lng}"><name>${b.id}. ${b.name}</name><desc>Base ${b.base} Adj ${adjClearance(b.base).toFixed(1)} ${vessel}</desc></wpt>`;});gpx+=`</gpx>`;const blob=new Blob([gpx],{type:'application/gpx+xml'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`winnipesaukee_${vessel}_${lakeLevel.toFixed(2)}ft_v24.gpx`;a.click();});
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});

initMap();render();
</script>
</body>
</html>
