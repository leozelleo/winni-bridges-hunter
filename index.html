<script>
// ============================================================
// BRIDGE DATA — 21 bridges
// ============================================================
const BRIDGES = [

  {"id":13,"name":"Weirs Channel Stone Bridge","lat":43.603611,"lng":-71.455,"clearanceFt":8,"zone":"Weirs","base":8,"vessels":{"car":true,"pwc":true,"smallboat":true,"kayak":true,"pedestrian":true},"photo":"images/bridge-13.webp"},

  {"id":15,"name":"Silver Sands Marina Walk","lat":43.581386,"lng":-71.406525,"clearanceFt":4,"zone":"Gilford","base":4,"vessels":{"car":false,"pwc":false,"smallboat":false,"kayak":true,"pedestrian":true},"photo":"images/bridge-15.webp"},
  {"id":16,"name":"Belknap Point Tiny Island","lat":43.5811,"lng":-71.4055,"clearanceFt":3,"zone":"Gilford","base":3,"vessels":{"car":false,"pwc":false,"smallboat":false,"kayak":true,"pedestrian":true},"photo":"images/bridge-16.webp"},
  {"id":17,"name":"Stonedam Island Causeway","lat":43.5845,"lng":-71.474,"clearanceFt":4,"zone":"Meredith","base":4,"vessels":{"car":false,"pwc":false,"smallboat":false,"kayak":true,"pedestrian":true},"photo":"images/bridge-17.webp"},
  {"id":18,"name":"Worcester Island Bridge","lat":43.5632,"lng":-71.2018,"clearanceFt":5,"zone":"Alton","base":5,"vessels":{"car":false,"pwc":true,"smallboat":true,"kayak":true,"pedestrian":true},"photo":"images/bridge-18.webp"},
  {"id":19,"name":"Wolfeboro Back Bay Bridge","lat":43.476389,"lng":-71.24,"clearanceFt":9,"zone":"Wolfeboro","base":9,"vessels":{"car":true,"pwc":true,"smallboat":true,"kayak":true,"pedestrian":true},"photo":"images/bridge-19.webp"},
  {"id":20,"name":"Alton Bay Bridge NH-11 1942","lat":43.4725,"lng":-71.236,"clearanceFt":10,"zone":"Alton Bay","base":10,"vessels":{"car":true,"pwc":true,"smallboat":true,"kayak":true,"pedestrian":true},"photo":"images/bridge-20.webp"},
  // FIX: 21st bridge — user-requested Bear/Pine Channel at 43°38'04.3"N 71°22'27.3"W
  {"id":21,"name":"Bear/Pine Channel (43\u00b038\u203204.3\u2033N) \u2605 User Added","lat":43.634528,"lng":-71.37420,"clearanceFt":7,"zone":"Center Harbor","base":7,"vessels":{"car":false,"pwc":true,"smallboat":false,"kayak":true,"pedestrian":true},"photo":"images/bridge-2.webp","userAdded":true}
];

// ============================================================
// STATE
// ============================================================
const FULL_LEVEL = 504.32;
let vessel = "all", term = "", map, markers = new Map(), routeLine = null, routeLines = [], lakeLevel = FULL_LEVEL, includeMarginal = true;

// A→B routing state
let routeMode = 'tour'; // 'tour' | 'ab'
let abStart = null, abEnd = null, abStartMarker = null, abEndMarker = null, abLine = null;

// ============================================================
// WATER GRAPH — waypoints + edges + island polygons
// ============================================================
const WATER_WAYPOINTS = [
  {id:'W0',lat:43.70,lng:-71.45},{id:'W1',lat:43.65,lng:-71.40},{id:'W2',lat:43.60,lng:-71.38},
  {id:'W3',lat:43.58,lng:-71.47},{id:'W4',lat:43.68,lng:-71.40},{id:'W5',lat:43.67,lng:-71.35},
  {id:'W6',lat:43.62,lng:-71.35},{id:'W7',lat:43.58,lng:-71.32},{id:'W8',lat:43.48,lng:-71.24},
  {id:'W9',lat:43.603,lng:-71.455},{id:'W10',lat:43.63,lng:-71.32},{id:'W11',lat:43.60,lng:-71.33}
];
const WATER_EDGES = [
  [0,1],[0,4],[0,9],[1,4],[1,9],[1,2],[2,11],[2,1],[2,3],[3,9],[3,1],
  [4,5],[5,6],[5,10],[6,7],[6,11],[6,10],[7,10],[7,8],[7,11],
  [9,0],[9,1],[9,3],[10,5],[10,6],[10,7],[10,11],[11,2],[11,6],[11,7]
];
const ISLAND_POLYS = [
  [[43.68,-71.36],[43.66,-71.32],[43.62,-71.33],[43.63,-71.37],[43.66,-71.39]], // Long Island
  [[43.64,-71.33],[43.62,-71.30],[43.61,-71.32],[43.62,-71.34]],                // Bear Island
  [[43.70,-71.42],[43.68,-71.40],[43.66,-71.41],[43.67,-71.44],[43.69,-71.44]], // Moultonborough Neck
  [[43.50,-71.26],[43.48,-71.22],[43.47,-71.24],[43.49,-71.28]]                 // Alton-Wolfeboro peninsula
];

// ============================================================
// GEOMETRY HELPERS
// ============================================================
function pointInPoly(pt, poly) {
  const x=pt.lng, y=pt.lat; let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][1],yi=poly[i][0],xj=poly[j][1],yj=poly[j][0];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function segIntersect(a1,a2,b1,b2) {
  const denom=(a1.lng-a2.lng)*(b1.lat-b2.lat)-(a1.lat-a2.lat)*(b1.lng-b2.lng);
  if(Math.abs(denom)<1e-9) return false;
  const t=((a1.lng-b1.lng)*(b1.lat-b2.lat)-(a1.lat-b1.lat)*(b1.lng-b2.lng))/denom;
  const u=-((a1.lng-a2.lng)*(a1.lat-b1.lat)-(a1.lat-a2.lat)*(a1.lng-b1.lng))/denom;
  return t>=0&&t<=1&&u>=0&&u<=1;
}
function crossesIsland(a, b) {
  for(const poly of ISLAND_POLYS){
    for(let i=0;i<poly.length;i++){
      const p1={lat:poly[i][0],lng:poly[i][1]}, p2={lat:poly[(i+1)%poly.length][0],lng:poly[(i+1)%poly.length][1]};
      if(segIntersect(a,b,p1,p2)) return true;
    }
    const mid={lat:(a.lat+b.lat)/2,lng:(a.lng+b.lng)/2};
    if(pointInPoly(mid,poly)) return true;
  }
  return false;
}
function isDirectWaterValid(a, b) { return !crossesIsland(a, b); }

// ============================================================
// ROUTING — Haversine + Dijkstra + TSP 2-opt
// ============================================================
function haversine(a, b) {
  const R=3958.8, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function nearestWP(pt) {
  let best=0, bestD=haversine(pt,WATER_WAYPOINTS[0]);
  for(let i=1;i<WATER_WAYPOINTS.length;i++){const d=haversine(pt,WATER_WAYPOINTS[i]);if(d<bestD){bestD=d;best=i;}}
  return best;
}
function dijkstra(s, e) {
  const n=WATER_WAYPOINTS.length, dist=Array(n).fill(Infinity), prev=Array(n).fill(-1), vis=Array(n).fill(false);
  dist[s]=0;
  for(let iter=0;iter<n;iter++){
    let u=-1, minD=Infinity;
    for(let i=0;i<n;i++) if(!vis[i]&&dist[i]<minD){minD=dist[i];u=i;}
    if(u===-1) break;
    vis[u]=true;
    for(const [a,b] of WATER_EDGES){
      let v=-1; if(a===u) v=b; else if(b===u) v=a; else continue;
      const w=haversine(WATER_WAYPOINTS[u],WATER_WAYPOINTS[v]);
      if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}
    }
  }
  let path=[], cur=e;
  while(cur!==-1){path.unshift(cur);cur=prev[cur];}
  return path[0]===s ? path : [s,e];
}
function getWaterPath(a, b) {
  try {
    if(isDirectWaterValid(a,b)) return [a,b];
    const s=nearestWP(a), e=nearestWP(b);
    const wpPath=dijkstra(s,e);
    const full=[a];
    for(const idx of wpPath) full.push(WATER_WAYPOINTS[idx]);
    full.push(b);
    return full;
  } catch(err){ return [a,b]; }
}
function getWaterDist(a, b) {
  try {
    const p=getWaterPath(a,b); let d=0;
    for(let i=1;i<p.length;i++) d+=haversine(p[i-1],p[i]);
    return d;
  } catch(err){ return haversine(a,b); }
}
function totalDist(r, isCar) {
  let d=0;
  for(let i=1;i<r.length;i++) d+=isCar?haversine(r[i-1],r[i]):getWaterDist(r[i-1],r[i]);
  return d;
}
function nearestOrder(points, fn) {
  if(points.length<=1) return points.slice();
  let idx=points.findIndex(p=>p.id===1); if(idx===-1) idx=0;
  let u=points.slice(), s=u.splice(idx,1)[0], o=[s];
  while(u.length>0){
    const last=o[o.length-1]; let best=0, bestD=fn(last,u[0]);
    for(let i=1;i<u.length;i++){const d=fn(last,u[i]);if(d<bestD){bestD=d;best=i;}}
    o.push(u.splice(best,1)[0]);
  }
  return o;
}
function twoOptSwap(arr, i, k) { return arr.slice(0,i).concat(arr.slice(i,k+1).reverse()).concat(arr.slice(k+1)); }
function twoOpt(route, fn) {
  if(route.length<4) return route;
  let best=route.slice(), bestDist=0;
  for(let i=1;i<best.length;i++) bestDist+=fn(best[i-1],best[i]);
  let imp=true, iter=0;
  while(imp&&iter<50){
    imp=false;
    for(let i=1;i<best.length-2;i++){
      for(let k=i+1;k<best.length-1;k++){
        const nr=twoOptSwap(best,i,k); let nd=0;
        for(let j=1;j<nr.length;j++) nd+=fn(nr[j-1],nr[j]);
        if(nd<bestDist-0.001){best=nr;bestDist=nd;imp=true;}
      }
    }
    iter++;
  }
  return best;
}
function shortest(points, isCar) {
  if(points.length<=2) return points;
  const fn=isCar?(a,b)=>haversine(a,b):getWaterDist;
  return twoOpt(nearestOrder(points,fn),fn);
}

// ============================================================
// FILTER + STATUS
// ============================================================
function passes(b, v) { if(v==='all') return true; return b.vessels[v]===true; }
function adjClearance(base) { return base + (FULL_LEVEL - lakeLevel); }
function statusFor(b) {
  if(vessel==="all"||vessel==="car"||vessel==="pedestrian") return "pass";
  const adj=adjClearance(b.base);
  const req={pwc:{comfortable:6,marginal:4.5},smallboat:{comfortable:6,marginal:4},kayak:{comfortable:3,marginal:1.5}}[vessel];
  if(!req) return "pass";
  if(adj>=req.comfortable) return "pass";
  if(adj>=req.marginal) return "marginal";
  return "fail";
}
function filteredWater() {
  let f=BRIDGES.filter(b=>{
    const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);
    if(!ok) return false;
    if(!passes(b,vessel)) return false;
    const s=statusFor(b);
    if(s==="pass") return true;
    if(s==="marginal"&&includeMarginal) return true;
    return vessel==="all";
  });
  return shortest(f,false);
}
function filteredCar() {
  return BRIDGES.filter(b=>{
    const ok=!term||(b.name+' '+b.zone).toLowerCase().includes(term);
    return ok && passes(b,vessel);
  });
}

// ============================================================
// RENDER
// ============================================================
async function render() {
  try {
    const delta=FULL_LEVEL-lakeLevel;
    document.getElementById('lakeLevelLabel').textContent=lakeLevel.toFixed(2);
    document.getElementById('deltaLabel').textContent=(delta>=0?'+'+delta.toFixed(2):delta.toFixed(2))+'ft';

    const isCar=vessel==='car';
    let route=isCar?filteredCar():filteredWater();
    if(isCar && route.length>1) route=shortest(route,true);

    // PWC info panel
    if(vessel==='pwc'){
      const directCount=(()=>{let c=0;for(let i=1;i<route.length;i++){if(isDirectWaterValid(route[i-1],route[i]))c++;}return c;})();
      document.getElementById('pwcFix').innerHTML=`<b>PWC Fix:</b> ${directCount} of ${route.length-1} legs use direct water (no island crossing). Waypoint detours only where Long Island, Bear Island, or Alton-Wolfeboro peninsula block the straight line.`;
      document.getElementById('pwcFix').classList.remove('hidden');
    } else {
      document.getElementById('pwcFix').classList.add('hidden');
    }

    if(map){
      markers.forEach(m=>{try{map.removeLayer(m)}catch(e){}});
      markers.clear();
      routeLines.forEach(l=>{try{map.removeLayer(l)}catch(e){}});
      routeLines=[];
      if(routeLine) try{map.removeLayer(routeLine)}catch(e){}

      BRIDGES.forEach(b=>{
        const s=statusFor(b);
        const isIn=route.includes(b);
        const color = b.userAdded ? '#a855f7'
                    : s==="pass" ? "#16a34a"
                    : s==="marginal" ? "#eab308"
                    : "#ef4444";
        const finalColor = vessel==="all"?(b.userAdded?'#a855f7':b.id===7?'#a855f7':'#16a34a'):color;
        const icon=L.divIcon({
          html:`<div style="background:${finalColor};width:28px;height:28px;border:3px solid white;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900;font-size:12px;opacity:${s==="fail"&&vessel!=="all"?0.3:isIn?1:0.5};box-shadow:0 1px 4px rgba(0,0,0,.4)">${isIn?route.indexOf(b)+1:b.id}</div>`,
          iconSize:[28,28],iconAnchor:[14,14]
        });
        const mk=L.marker([b.lat,b.lng],{icon}).addTo(map);
        mk.on('click',()=>openDetail(b.id));
        markers.set(b.id,mk);
      });

      if(route.length>1){
        if(isCar){
          const full=route.map(b=>[b.lat,b.lng]);
          routeLine=L.polyline(full,{color:'#ea580c',weight:5,opacity:0.9}).addTo(map);
        } else {
          let fullPath=[];
          for(let i=0;i<route.length;i++){
            if(i>0){
              const seg=getWaterPath(route[i-1],route[i]);
              for(let j=1;j<seg.length-1;j++) fullPath.push([seg[j].lat,seg[j].lng]);
            }
            fullPath.push([route[i].lat,route[i].lng]);
          }
          routeLine=L.polyline(fullPath,{color:'#2563eb',weight:5,opacity:0.85,dashArray:'5,5'}).addTo(map);
        }
        try{map.fitBounds(L.latLngBounds(route.map(b=>[b.lat,b.lng])).pad(0.18));}catch(e){}
      }
    }

    const dist=totalDist(route,isCar);
    document.getElementById('routeStats').textContent=`${route.length} stops · ${dist.toFixed(1)} mi`;
    document.getElementById('routeInfo').textContent=`${route.length} stops · ${dist.toFixed(1)} mi · ${vessel.toUpperCase()}`;
    document.getElementById('countBadge').textContent=`${route.length} / 21 · ${dist.toFixed(1)} mi`;

    document.getElementById('list').innerHTML=route.map((b,idx)=>{
      const s=statusFor(b); const adj=adjClearance(b.base);
      const isDirect=idx<route.length-1?isDirectWaterValid(b,route[idx+1]):true;
      const distNext=idx<route.length-1?(isCar?haversine(b,route[idx+1]):getWaterDist(b,route[idx+1])).toFixed(2)+' mi →':null;
      const badge=s==="fail"?`<span class="bg-red-100 text-red-700 px-1.5 py-0.5 rounded-full text-[8px] font-bold">BLOCKED</span>`
                 :s==="marginal"?`<span class="bg-yellow-100 text-yellow-700 px-1.5 py-0.5 rounded-full text-[8px] font-bold">MARGINAL</span>`
                 :`<span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded-full text-[8px] font-bold">CLEAR</span>`;
      const star=b.userAdded?` <span class="bg-purple-100 text-purple-700 px-1 py-0.5 rounded text-[8px] font-bold">★ NEW</span>`:'';
      return `<div class="bg-white rounded-[12px] border overflow-hidden shadow-sm cursor-pointer hover:shadow-md transition-shadow" onclick="openDetail(${b.id})">
        <div class="flex gap-0">
          <img src="${b.photo}" loading="lazy" class="w-[60px] h-[60px] object-cover shrink-0 m-2 rounded-lg" onerror="this.style.display='none'">
          <div class="p-2 flex-1 min-w-0">
            <div class="font-black text-[11px]">#${idx+1} ${b.name}${star}</div>
            <div class="text-[9px] text-zinc-600">${b.zone} · Adj clearance: ${adj.toFixed(1)}ft</div>
            <div class="flex items-center gap-1 mt-1 flex-wrap">
              ${badge}
              ${!isCar&&idx<route.length-1?`<span class="text-[8px] text-zinc-400">${isDirect?'DIRECT':'VIA WAYPOINT'}</span>`:''}
              ${distNext?`<span class="ml-auto bg-zinc-900 text-white px-2 py-0.5 rounded-full text-[8px] font-bold">${distNext}</span>`:'<span class="ml-auto bg-zinc-200 text-zinc-600 px-2 py-0.5 rounded-full text-[8px] font-bold">END</span>'}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');

  } catch(err){ console.error('render error', err); }
}

function openDetail(id) {
  const b=BRIDGES.find(x=>x.id===id); if(!b) return;
  const f=vessel==='car'?filteredCar():filteredWater();
  const idx=f.findIndex(x=>x.id===id);
  if(map) map.flyTo([b.lat,b.lng],14);
  const adj=adjClearance(b.base);
  const s=statusFor(b);
  const statusColor=s==='fail'?'bg-red-100 text-red-700':s==='marginal'?'bg-yellow-100 text-yellow-700':'bg-green-100 text-green-700';
  document.getElementById('detailInner').innerHTML=`
    <div class="p-3">
      <div class="flex justify-between items-start">
        <div>
          <div class="font-black text-[13px]">#${idx+1} ${b.name}</div>
          <div class="flex gap-1 mt-1 flex-wrap">
            <span class="text-[9px] bg-zinc-100 px-2 py-1 rounded-full">${b.zone}</span>
            <span class="text-[9px] ${statusColor} px-2 py-1 rounded-full font-bold">${s.toUpperCase()} · ${adj.toFixed(1)}ft adj</span>
            ${b.userAdded?'<span class="text-[9px] bg-purple-100 text-purple-700 px-2 py-1 rounded-full font-bold">★ User Added</span>':''}
          </div>
        </div>
        <button onclick="closeDetail()" class="h-8 w-8 rounded-full bg-zinc-100 grid place-items-center text-lg leading-none shrink-0 ml-2">✕</button>
      </div>
      <img src="${b.photo}" class="w-full h-[200px] object-cover rounded-xl mt-3" loading="lazy" onerror="this.style.display='none'">
      <div class="mt-3 text-[10px] grid grid-cols-2 gap-2">
        <div class="bg-zinc-50 rounded-lg p-2">
          <div class="text-zinc-500 text-[8px] font-bold uppercase mb-1">Base Clearance</div>
          <div class="font-black text-[14px]">${b.base}ft</div>
          <div class="text-zinc-400">at full pool ${FULL_LEVEL}ft</div>
        </div>
        <div class="bg-zinc-50 rounded-lg p-2">
          <div class="text-zinc-500 text-[8px] font-bold uppercase mb-1">Current Adjusted</div>
          <div class="font-black text-[14px]">${adj.toFixed(1)}ft</div>
          <div class="text-zinc-400">lake at ${lakeLevel.toFixed(2)}ft</div>
        </div>
      </div>
      <div class="mt-2 text-[9px] text-zinc-500 grid grid-cols-3 gap-1">
        ${['car','pwc','smallboat','kayak','pedestrian'].map(v=>`<span class="${b.vessels[v]?'bg-green-50 text-green-700':'bg-red-50 text-red-400'} px-2 py-1 rounded text-center font-bold">${v==='smallboat'?'S.Boat':v.charAt(0).toUpperCase()+v.slice(1)} ${b.vessels[v]?'✓':'✗'}</span>`).join('')}
      </div>
      <div class="mt-2 text-[9px] text-zinc-400">📍 ${b.lat.toFixed(6)}°N, ${Math.abs(b.lng).toFixed(6)}°W</div>
    </div>`;
  document.getElementById('detail').classList.remove('hidden');
}
function closeDetail() { document.getElementById('detail').classList.add('hidden'); }
window.openDetail = openDetail;
window.closeDetail = closeDetail;

// ============================================================
// FIX: LIVE LAKE LEVEL FETCH from Bizer.com
// (uses allorigins.win CORS proxy; falls back gracefully)
// ============================================================
async function fetchLiveLevel() {
  const btn = document.getElementById('fetchLiveBtn');
  const lbl = document.getElementById('liveLabel');
  btn.textContent = '↻ ...';
  btn.disabled = true;
  try {
    const TARGET = 'https://www.bizer.com/bzt/bztmap.shtml';
    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(TARGET), {
      signal: AbortSignal.timeout(9000)
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    // Regex from changelog v33: matches "Lake Level ... 504.xx"
    const m = text.match(/Lake Level[^0-9]{0,30}([5][0-9]{2}\.[0-9]{1,2})/i);
    if(!m) throw new Error('Level pattern not found in page');
    const lvl = parseFloat(m[1]);
    if(lvl < 500 || lvl > 510) throw new Error('Level out of expected range: ' + lvl);
    lakeLevel = lvl;
    document.getElementById('lakeSlider').value = lvl;
    lbl.textContent = '🔴 LIVE';
    lbl.className = 'bg-red-500 text-white text-[8px] font-bold px-1.5 py-0.5 rounded';
    lbl.classList.remove('hidden');
    btn.textContent = '✓ Live';
    render();
  } catch(e) {
    lbl.textContent = '⚫ offline';
    lbl.className = 'bg-zinc-500 text-white text-[8px] font-bold px-1.5 py-0.5 rounded';
    lbl.classList.remove('hidden');
    btn.textContent = '↻ Live';
    console.warn('Live level fetch failed:', e.message);
  }
  btn.disabled = false;
}

// ============================================================
// FIX: GPX EXPORT (was dead button, now functional)
// ============================================================
function exportGPX() {
  const isCar = vessel === 'car';
  const route = isCar ? filteredCar() : filteredWater();
  if(!route.length){ alert('No bridges in current route to export.'); return; }

  // Build full track (with water waypoints between bridge stops)
  let trkPts = [];
  for(let i=0;i<route.length;i++){
    if(i>0 && !isCar){
      const seg = getWaterPath(route[i-1], route[i]);
      for(let j=1;j<seg.length-1;j++) trkPts.push(seg[j]);
    }
    trkPts.push(route[i]);
  }

  const dist = totalDist(route, isCar).toFixed(1);
  const now = new Date().toISOString();
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Winni Bridge Hunter v32" xmlns="http://www.topografix.com/GPX/1/1">
<metadata>
  <name>Winni ${esc(vessel.toUpperCase())} Route – ${route.length} bridges – ${dist}mi</name>
  <time>${now}</time>
</metadata>
`;
  // Named waypoints at each bridge stop
  route.forEach((b,i) => {
    gpx += `<wpt lat="${b.lat}" lon="${b.lng}"><name>${esc(`${i+1}. ${b.name}`)}</name><desc>Zone: ${esc(b.zone)} | Adj clearance: ${adjClearance(b.base).toFixed(1)}ft | Status: ${statusFor(b)}</desc></wpt>\n`;
  });
  // Track segment
  gpx += `<trk><name>${route.length} bridges · ${dist}mi · ${vessel.toUpperCase()} · ${now.slice(0,10)}</name><trkseg>\n`;
  trkPts.forEach(p => { gpx += `<trkpt lat="${p.lat}" lon="${p.lng}"></trkpt>\n`; });
  gpx += `</trkseg></trk>\n</gpx>`;

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'}));
  a.download = `winni-${vessel}-${route.length}stops-${dist}mi-${now.slice(0,10)}.gpx`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

// ============================================================
// FIX: A→B CLICK ROUTING (was missing from v31)
// ============================================================
function clearABRoute() {
  [abStartMarker, abEndMarker, abLine].forEach(l => { if(l) try{map.removeLayer(l);}catch(e){} });
  abStart = abEnd = abStartMarker = abEndMarker = abLine = null;
  document.getElementById('routeHint').innerHTML = 'Click the map to set your <b>Start</b> point.';
}
window.clearABRoute = clearABRoute;

function updateABLine() {
  if(abLine) { try{map.removeLayer(abLine);}catch(e){} abLine=null; }
  if(!abStartMarker || !abEndMarker) return;
  const s=abStartMarker.getLatLng(), e=abEndMarker.getLatLng();
  abLine = L.polyline([s,e], {color:'#6366f1', weight:3, dashArray:'6,6', opacity:0.9}).addTo(map);
  const m = map.distance(s,e);
  const nm = (m/1852).toFixed(2), mi = (m/1609.34).toFixed(2);
  document.getElementById('routeHint').innerHTML =
    `📍 <b>${nm} NM</b> &nbsp;·&nbsp; ${mi} mi &nbsp;&mdash;&nbsp; <button onclick="clearABRoute()" class="underline text-indigo-700">Clear route</button> or click map again to reset.`;
}

// ============================================================
// MAP INIT — includes A→B click handler
// ============================================================
function initMap() {
  try {
    map = L.map('map', {center:[43.60,-71.38], zoom:11});
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OSM'}).addTo(map);

    // FIX: A→B click routing on map
    map.on('click', function(e) {
      if(routeMode !== 'ab') return;
      if(!abStart) {
        abStart = e.latlng;
        abStartMarker = L.marker(abStart, {
          draggable: true,
          icon: L.divIcon({html:`<div style="background:#16a34a;color:white;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:900;border:3px solid white;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.4)">S</div>`,iconSize:[28,28],iconAnchor:[14,14]})
        }).addTo(map);
        abStartMarker.on('drag', updateABLine);
        document.getElementById('routeHint').innerHTML = '✅ <b>Start</b> set! Now click to place your <b>End</b> point.';
      } else if(!abEnd) {
        abEnd = e.latlng;
        abEndMarker = L.marker(abEnd, {
          draggable: true,
          icon: L.divIcon({html:`<div style="background:#ef4444;color:white;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:900;border:3px solid white;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.4)">E</div>`,iconSize:[28,28],iconAnchor:[14,14]})
        }).addTo(map);
        abEndMarker.on('drag', updateABLine);
        updateABLine();
      } else {
        // Third click resets route
        clearABRoute();
      }
    });

    setTimeout(() => { try{map.invalidateSize();}catch(e){} }, 500);
  } catch(err) {
    document.getElementById('map').innerHTML = '<div style="padding:20px;color:red">Map failed: '+err.message+'</div>';
  }
}

initMap();
fetchLiveLevel(); // Auto-fetch live level on page load
setTimeout(() => { try{render();}catch(e){console.error(e);} }, 800);
</script>
