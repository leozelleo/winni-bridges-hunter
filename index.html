<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winni Bridges Hunter - Bizer Route Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>body{margin:0;font-family:system-ui} #header{padding:12px 16px;background:#0f172a;color:white;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}#header h1{margin:0;font-size:18px}#lakeStatus{background:#1e293b;padding:8px 12px;border-radius:8px;font-size:13px}#map{height:62vh}#panel{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){#panel{grid-template-columns:1fr}}.card{border:1px solid #e2e8f0;border-radius:12px;padding:12px}.bridge{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9}.badge{padding:2px 6px;border-radius:999px;font-size:11px}.ok{background:#dcfce7;color:#166534}.warn{background:#fef9c3;color:#854d0e}.danger{background:#fee2e2;color:#991b1b}</style>
</head>
<body>
<div id="header"><h1>🚤 Winni-Bridges-Hunter — Bizer routing</h1><div id="lakeStatus">Loading...</div></div>
<div id="map"></div>
<div id="panel"><div class="card"><h3>Bridges - Clearance vs Current Level</h3><div id="bridgeList"></div></div><div class="card"><h3>Bizer Route Check</h3><input id="draft" type="number" value="5.0" step="0.1" style="padding:8px;border:1px solid #cbd5e1;border-radius:8px;width:100px"> ft <button onclick="checkRoute()" style="padding:8px 12px;border-radius:8px;border:0;background:#0f172a;color:white">Check Route</button><div id="routeResult" style="margin-top:12px"></div><div style="font-size:12px;color:#64748b;margin-top:12px">API: <a href="/api/lakelevel">/api/lakelevel</a> | Stable: <span id="stableUrl"></span></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FULL_POOL=504.32;let currentLevel=null,bridges=[];
async function load(){document.getElementById('stableUrl').textContent=window.location.origin;const b=await fetch('./data/bridges.json');bridges=await b.json();try{const r=await fetch('/api/lakelevel');const d=await r.json();currentLevel=d.level;const dt=new Date(d.time).toLocaleString();const badge=d.live?'<span class="badge ok">LIVE</span>':'<span class="badge danger">STALE '+dt+'</span>';document.getElementById('lakeStatus').innerHTML=`Level: <b>${d.level} ft</b> (${d.gageHeight} ft gage) ${badge} | Full ${d.fullPool} ft | ${dt}`;render();initMap();}catch(e){document.getElementById('lakeStatus').textContent='Failed: '+e;}}
function getClr(b){return currentLevel==null?b.baseClearanceFt:b.baseClearanceFt-(currentLevel-FULL_POOL);}
function render(){const l=document.getElementById('bridgeList');l.innerHTML='';bridges.forEach(br=>{const c=getClr(br);const badge=c<0?'<span class="badge danger">BLOCKED</span>':c<3?'<span class="badge warn">LOW</span>':'<span class="badge ok">OK</span>';const d=document.createElement('div');d.style.display='flex';d.style.justifyContent='space-between';d.innerHTML=`<span>${br.name}</span><span>${c.toFixed(1)}ft ${badge}</span>`;l.appendChild(d);});}
function initMap(){const m=L.map('map').setView([43.61,-71.42],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);bridges.forEach(br=>{const c=getClr(br);const col=c<0?'red':c<3?'orange':'green';L.circleMarker([br.lat,br.lng],{radius:8,color:col,fillColor:col,fillOpacity:.8}).addTo(m).bindPopup(br.name+'<br>'+c.toFixed(1)+'ft');});}
function checkRoute(){const draft=parseFloat(document.getElementById('draft').value)||0;const blocked=[];bridges.forEach(br=>{if(getClr(br)<draft)blocked.push(br.name);});document.getElementById('routeResult').innerHTML=blocked.length?'<span class="badge danger">BLOCKED: '+blocked.join(', ')+'</span>':'<span class="badge ok">CLEAR for '+draft+'ft</span>';}
load();
</script>
</body>
</html>
