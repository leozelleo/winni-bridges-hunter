let vessel="all", term="", map, markers=new Map(), routeLine=null;
function haversine(a,b){
  const R=3958.8;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLng=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function totalDist(route){
  let d=0;
  for(let i=1;i<route.length;i++) d+=haversine(route[i-1], route[i]);
  return d;
}
function nearestNeighborOrder(bridges){
  if(bridges.length<=1) return bridges.slice();
  let idx = bridges.findIndex(b=>b.id===1);
  if(idx===-1) idx=0;
  let unvisited = bridges.slice();
  let start = unvisited.splice(idx,1)[0];
  let ordered=[start];
  while(unvisited.length>0){
    let last=ordered[ordered.length-1];
    let best=0, bestD=haversine(last, unvisited[0]);
    for(let i=1;i<unvisited.length;i++){
      let d=haversine(last, unvisited[i]);
      if(d<bestD){ bestD=d; best=i; }
    }
    ordered.push(unvisited.splice(best,1)[0]);
  }
  return ordered;
}
function twoOptSwap(route,i,k){
  return route.slice(0,i).concat(route.slice(i,k+1).reverse()).concat(route.slice(k+1));
}
function twoOpt(route){
  if(route.length<4) return route;
  let best=route.slice();
  let bestDist=totalDist(best);
  let improved=true;
  let iter=0;
  while(improved && iter<50){
    improved=false;
    for(let i=1;i<best.length-2;i++){
      for(let k=i+1;k<best.length-1;k++){
        let newRoute=twoOptSwap(best,i,k);
        let nd=totalDist(newRoute);
        if(nd < bestDist - 0.001){
          best=newRoute;
          bestDist=nd;
          improved=true;
        }
      }
    }
    iter++;
  }
  return best;
}
function shortestRoute(bridges){
  if(bridges.length<=2) return bridges;
  return twoOpt(nearestNeighborOrder(bridges));
}
const FULL_LEVEL=504.32; let lakeLevel=504.32, includeMarginal=true;
const REQ={pwc:{comfortable:6,marginal:4.5,label:'PWC'},smallboat:{comfortable:6,marginal:4,label:'Small Boat'},kayak:{comfortable:3,marginal:1.5,label:'Kayak'},all:{comfortable:0,marginal:0,label:'All 20'}};
function adjClearance(b){return b+(FULL_LEVEL-lakeLevel);} function statusFor(br){if(vessel==='all')return 'pass';const adj=adjClearance(br.base);const req=REQ[vessel];if(adj>=req.comfortable)return 'pass';if(adj>=req.marginal)return 'marginal';return 'fail';}
function filtered(){let f=BRIDGES.filter(b=>{const s=(b.name+' '+b.zone+' '+b.type).toLowerCase();return (!term || s.includes(term)) && (vessel==='all' || b.vessels[vessel]) && (vessel==='all' || statusFor(b)!=='fail' || (statusFor(b)==='marginal' && includeMarginal));});return shortestRoute(f);}
function initMap(){
  map=L.map('map',{center:[43.60,-71.38],zoom:11,zoomControl:false});
  L.control.zoom({position:'bottomright'}).addTo(map);
  const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
  L.control.layers({"Streets":osm,"Satellite":sat}).addTo(map);
  setTimeout(()=>map.invalidateSize(),300);
}
function passes(b,v){ if(v==='all') return true; return b.vessels[v]===true; }
function dotColor(b,v){ if(v==='all') return b.id===7 ? '#a855f7' : '#000'; return b.vessels[v] ? (b.clearanceFt<4 && (v==='pwc'||v==='smallboat') ? '#eab308' : '#22c55e') : '#ef4444'; }
function label(v,b){ if(!b.vessels[v]) return 'No'; if(v==='pwc' && b.clearanceFt<5) return 'Duck'; if(v==='smallboat' && b.clearanceFt<6) return 'Bimini down'; if(v==='kayak' && b.clearanceFt<3) return 'Portage'; return 'Yes'; }

function render(){
  const f=filtered();
  if(map){
    markers.forEach(m=>{ try{map.removeLayer(m)}catch(e){} }); markers.clear();
    if(routeLine) try{map.removeLayer(routeLine)}catch(e){}
    if(f.length>1){
      const latlngs=f.map(b=>[b.lat,b.lng]);
      routeLine=L.polyline(latlngs,{color:'#2563eb',weight:4,opacity:0.85}).addTo(map);
      try{ map.fitBounds(L.latLngBounds(latlngs).pad(0.15)); }catch(e){}
    }
    f.forEach((b, idx)=>{
      const icon=L.divIcon({html:`<div style="background:${dotColor(b,vessel)};width:28px;height:28px;border:3px solid white;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:white">${idx+1}</div>`,iconSize:[28,28],iconAnchor:[14,14],className:''});
      const mk=L.marker([b.lat,b.lng],{icon}).addTo(map); mk.on('click',()=>openDetail(b.id)); markers.set(b.id,mk);
    });
  }
  let dist=totalDist(f);
  document.getElementById('routeInfo').textContent = `${f.length} stops • ${dist.toFixed(1)} mi • ${vessel.toUpperCase()} SHORTEST`;
  document.getElementById('list').innerHTML = f.map((b, idx)=>`
    <div class="bg-white rounded-[14px] border overflow-hidden shadow-sm cursor-pointer" onclick="openDetail(${b.id})">
      <div class="flex gap-2"><img src="${b.photo}" class="w-[96px] h-[96px] object-cover shrink-0"><div class="p-2 flex-1 min-w-0"><div class="font-bold text-[12px] leading-tight">#${idx+1} - ${b.name}</div><div class="text-[10px] text-zinc-500">${b.zone} • ${b.clearance}</div><div class="text-[11px] mt-1 font-bold" style="color:${dotColor(b,vessel)}">${vessel.toUpperCase()}: ${label(vessel,b)} • ${idx < f.length-1 ? haversine(b, f[idx+1]).toFixed(2)+' mi to next' : 'END'}</div></div><div class="w-2 self-stretch" style="background:${dotColor(b,vessel)}"></div></div>
    </div>
  `).join('') || `<div class="p-8 text-center">No match</div>`;
}
function openDetail(id){
  const b=BRIDGES.find(x=>x.id===id); if(!b) return; if(map) map.flyTo([b.lat,b.lng],15);
  const rows=['car','pwc','smallboat','kayak','pedestrian'].map(v=>{
    const ok=b.vessels[v]; const c= ok ? (b.clearanceFt<4 && v!=='pedestrian' && v!=='kayak' ? '#eab308' : '#22c55e') : '#ef4444';
    return `<div class="flex justify-between py-2 border-b text-[12px]"><span class="font-bold">${v.toUpperCase()}</span><span style="color:${c};font-weight:800">${ok?label(v,b):'No'}</span></div>`;
  }).join('');
  document.getElementById('detailInner').innerHTML=`<div class="p-4"><div class="flex justify-between"><div><div class="font-black text-[15px]">${b.name}</div><div class="text-[10px] bg-zinc-100 inline-block px-2 py-1 rounded-full mt-1">${b.zone} • ${b.clearance}</div><div class="text-[11px] font-bold text-green-700 mt-1">${b.lat.toFixed(6)},${b.lng.toFixed(6)} ON WATER</div></div><button onclick="closeDetail()" class="h-9 w-9 rounded-full bg-zinc-100 grid place-items-center">X</button></div><div class="mt-3 border rounded-xl p-3">${rows}</div><div class="mt-3 bg-zinc-50 border rounded-xl p-3 text-[11px]">${b.type}</div><div class="mt-3"><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" class="h-11 w-full grid place-items-center rounded-full bg-black text-white font-bold text-[13px]">Open in Google Maps</a></div></div>`;
  document.getElementById('detail').classList.remove('hidden');
}
function closeDetail(){ document.getElementById('detail').classList.add('hidden'); }
window.openDetail=openDetail; window.closeDetail=closeDetail;
document.getElementById('search').addEventListener('input',e=>{ term=e.target.value.toLowerCase(); render(); });
document.querySelectorAll('.vBtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.vBtn').forEach(b=>b.className='vBtn px-3 h-8 rounded-full bg-zinc-100 font-bold text-[11px]');
    btn.className='vBtn px-3 h-8 rounded-full bg-black text-white font-bold text-[11px]';
    vessel=btn.dataset.v; render();
  });
});
document.getElementById('gpxBtn').addEventListener('click',()=>{
  const f=filtered(); let gpx=`<?xml version="1.0"?><gpx><name>Winni ${vessel} shortest</name><desc>${f.length} stops - ${totalDist(f).toFixed(1)} mi</desc>`; f.forEach(b=>{ gpx+=`<wpt lat="${b.lat}" lon="${b.lng}"><name>${b.id}. ${b.name}</name><desc>${b.clearance}</desc></wpt>`; }); gpx+=`</gpx>`; const blob=new Blob([gpx],{type:'application/gpx+xml'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`winnipesaukee_shortest_${vessel}.gpx`; a.click();
});
document.getElementById('detail').addEventListener('click',e=>{ if(e.target.id==='detail') closeDetail(); });
initMap(); render();
</script>
</body>
</html>
